}
// Agrega columnas nuevas cuando el calendario del proyecto crece; nunca borra una fecha que ya tenía datos.
// Si cambió la forma de las secciones (PLANNER_VERSION), se regeneran desde cero.
const SECCIONES_CON_TURNO = ['Ruta Crítica','Catering','Mano de Obra Local','CARGO'];
function sincronizarPlanner(p){
  const fechas = fechasProyectoPlanner(p);
  if(!p.planner || p.planner.version!==PLANNER_VERSION) p.planner = {version:PLANNER_VERSION, secciones: seccionesPlannerDefault(p,fechas), tareasPorDia:{}};
  if(!p.planner.tareasPorDia) p.planner.tareasPorDia={};
  p.planner.secciones.forEach(sec=>{
    if(sec.turno===undefined) sec.turno = SECCIONES_CON_TURNO.includes(sec.nombre); // migración: secciones creadas antes de que existiera turno día/noche
    if(sec.grupos){
      // si se agregó un área nueva al proyecto después de creado el Planner, le abre su grupo aquí
      p.areas.forEach(a=>{ if(!sec.grupos[a.id]) sec.grupos[a.id]=[]; });
    }
    if(sec.nombre==='Ruta Crítica'){
      // Una fila por área del proyecto — si se agrega un área nueva después de creado el Planner, su
      // fila aparece sola aquí. Las filas ya existentes (con su texto capturado) nunca se tocan ni se
      // duplican; solo se agregan las que falten, comparando por el id del área (no por el nombre, que
      // se puede renombrar a mano en esta tabla sin que eso cuente como "ya no corresponde al área").
      p.areas.forEach(a=>{
        if(!sec.rows.some(r=>r.areaId===a.id)) sec.rows.push(nuevaFilaPlanner(a.nombre,'texto',fechas,{areaId:a.id}));
      });
    }
    const rellenar = (row, vacio) => {
      if(!row.cellsNoche) row.cellsNoche={};
      fechas.forEach(f=>{
        if(!row.cells[f]) row.cells[f]=vacio();
        if(sec.turno && !row.cellsNoche[f]) row.cellsNoche[f]=vacio();
      });
    };
    if(sec.modo==='maquinaria'){ Object.values(sec.grupos).forEach(rows=>rows.forEach(row=>rellenar(row,()=>({text:''})))); return; }
    if(sec.modo==='cargo'){ Object.values(sec.grupos).forEach(rows=>rows.forEach(row=>rellenar(row,()=>({status:'',text:''})))); return; }
    if(sec.modo==='manoobra'){ Object.values(sec.grupos).forEach(rows=>rows.forEach(row=>rellenar(row,()=>({text:''})))); return; }
    if(sec.modo==='catering'){ sec.rows.forEach(row=>{ if(!row.cellsNoche) row.cellsNoche={}; fechas.forEach(f=>{ if(row.cells[f]===undefined) row.cells[f]=null; if(sec.turno && row.cellsNoche[f]===undefined) row.cellsNoche[f]=null; }); }); return; }
    sec.rows.forEach(row=>rellenar(row,()=>({text:''})));
  });
  return p.planner;
}
function nuevaFilaMaquinaria(fechas){ return {id:uuid(), maquinaria:MAQUINARIA_CATALOGO[0], cells: Object.fromEntries(fechas.map(f=>[f,{text:''}]))}; }

// ============ Proyector (proyección de costos), nativo del proyecto ============
// El turno de cada persona sale del calendario por área del Brief — no hay un calendario aparte que
// mantener. Solo se guarda una excepción por persona/fecha cuando de verdad difiere de su área.
function puestosPagoDefault(){
  return [
    {nombre:'Jefe de Cuadrilla', categoria:'steel'}, {nombre:'Boneyard', categoria:'steel'}, {nombre:'Armador', categoria:'steel'},
    {nombre:'Armador Eventual', categoria:'steel'}, {nombre:'Chofer Armador', categoria:'steel'},
    {nombre:'Supervisor de Site', categoria:'eps'}, {nombre:'Auxiliar de Site', categoria:'eps'},
    {nombre:'Jefe de Steel', categoria:'ops'}, {nombre:'Project Manager Jr', categoria:'ops'}, {nombre:'Project Manager Sr', categoria:'ops'},
    {nombre:'Gerencia', categoria:'ops'}, {nombre:'Dirección', categoria:'ops'}
  ].map(x=>({id:uuid(), modeloPago:'puntos', valorPorPunto:0, baseFijaNacional:0, baseFijaInternacional:0,
    sueldoDiarioNacional:0, sueldoDiarioInternacional:0, feeNacional:0, feeInternacional:0,
    viaticoNacional:0, viaticoInternacional:0, ...x}));
}
const MODELOS_PAGO = [{k:'puntos',l:'Pago por puntos'},{k:'diario',l:'Sueldo diario fijo'},{k:'fee',l:'Fee total del proyecto'}];
// Puntos por tipo de día (mismo vocabulario del calendario del Brief: Previo/Montaje/Show/Desmontaje/Guardia/Salida)
const PUNTOS_POR_TIPO_DEFAULT = {previo:0.5, montaje:1.5, show:0.5, desmontaje:1.5, guardia:0.5, salida:0.5};
function puestoPagoDeArea(areaK){ return (C().puestosPago||[]).filter(x=>x.categoria===areaK); }
function puntosDeTipo(tipoNombre){ return Number((C().puntosPorTipo||{})[norm(tipoNombre)])||0; }
function nuevoCrewProyector(area, puestoId){ return {id:uuid(), personaId:null, area, puestoId: puestoId||((puestoPagoDeArea(area)[0]||{}).id||null), turnosOverride:{}}; }
// El turno de una persona en una fecha: su excepción propia si la tiene, si no la plantilla del área
function turnoEfectivoProyector(p, persona, fecha){ return (persona.turnosOverride&&persona.turnosOverride[fecha]) || tipoDia(fechasDeArea(p,persona.area), fecha); }
function calcularPersonaProyector(p, persona){
  const rangoArea = rangoDeArea(p, persona.area); if(!rangoArea) return {puntos:0,diasTrabajados:0,pago:0,viaticos:0,total:0};
  const dias = diasDeRango(rangoArea.ini, rangoArea.fin);
  let puntos=0, diasTrabajados=0;
  dias.forEach(f=>{ const t=turnoEfectivoProyector(p,persona,f); const pts=puntosDeTipo(t); if(t){ puntos+=pts; diasTrabajados++; } });
  const puesto=(C().puestosPago||[]).find(x=>x.id===persona.puestoId)||{};
  const internacional = (p.proyector||{}).modo==='internacional';
  const viaticoDia = internacional?Number(puesto.viaticoInternacional)||0:Number(puesto.viaticoNacional)||0;
  const viaticos = diasTrabajados*viaticoDia;
  const modelo = puesto.modeloPago||'puntos';
  let pago=0;
  if(modelo==='diario'){
    const sueldoDia = internacional?Number(puesto.sueldoDiarioInternacional)||0:Number(puesto.sueldoDiarioNacional)||0;
    pago = diasTrabajados*sueldoDia;
  } else if(modelo==='fee'){
    pago = internacional?Number(puesto.feeInternacional)||0:Number(puesto.feeNacional)||0;
  } else {
    const baseFija = internacional?Number(puesto.baseFijaInternacional)||0:Number(puesto.baseFijaNacional)||0;
    pago = puntos*(Number(puesto.valorPorPunto)||0)+baseFija;
  }
  return {puntos, diasTrabajados, pago, viaticos, total:pago+viaticos};
}
function sincronizarProyector(p){
  if(!p.proyector){
    p.proyector = {modo:'nacional', crew:[]};
    // primera vez: siembra el crew con los responsables ya asignados en el Brief, para no recapturarlos
    // (el puesto libre que se haya escrito ahí se busca por nombre en el catálogo de pago; si no hay
    // coincidencia, queda sin puesto y se elige a mano)
    Object.entries(p.responsablesPorArea||{}).forEach(([areaId,r])=>{
      if(!r || !r.personaId) return;
      const puesto = (C().puestosPago||[]).find(x=>norm(x.nombre)===norm(r.puesto||''));
      const c=nuevoCrewProyector(areaId, puesto?puesto.id:null); c.personaId=r.personaId; p.proyector.crew.push(c);
    });
  }
  return p.proyector;
}
function totalesProyector(p){
  const pl=sincronizarProyector(p);
  let pago=0, viaticos=0;
  pl.crew.forEach(c=>{ const r=calcularPersonaProyector(p,c); pago+=r.pago; viaticos+=r.viaticos; });
  return {pago, viaticos, total:pago+viaticos, n:pl.crew.length};
}

// ---- Hospedaje: solo cantidad de cuartos necesarios (sin costo). Un cuarto por persona para
// todo el evento (no cambia por noche). Steel siempre Cuádruple; EPS Doble si son 3 o menos,
// si no también Cuádruple; Operaciones siempre Sencilla. Regla tomada del Proyector original.
// ---- Costo de hospedaje: noches = días del rango del proyecto menos uno (check-in a check-out),
// una tarifa por noche por tipo de cuarto. Cuartos-noche = cuartos × noches.
function tarifasHospedajeProyector(p){ if(!p.proyector.hospedajeTarifas) p.proyector.hospedajeTarifas={sencilla:0,doble:0,cuadruple:0}; return p.proyector.hospedajeTarifas; }
function calcularCostoHospedaje(p){
  const h=calcularHabitacionesProyector(p); const tarifas=tarifasHospedajeProyector(p);
  const rango=rangoDeProyecto(p); const noches = rango ? Math.max(0, diasDeRango(rango.ini,rango.fin).length-1) : 0;
  const fila = (n,tarifa) => ({habitaciones:n, noches, cuartosNoche:n*noches, tarifa:num(tarifa), subtotal:n*noches*num(tarifa)});
  const sencilla=fila(h.sencillas,tarifas.sencilla), doble=fila(h.dobles,tarifas.doble), cuadruple=fila(h.cuadruples,tarifas.cuadruple);
  return {sencilla, doble, cuadruple, noches, total: sencilla.subtotal+doble.subtotal+cuadruple.subtotal};
}
// ---- Costo de traslado: una tarifa por unidad para cada tipo (avión, autobús, uber, taxi, renta de auto).
// Uber usa la cantidad efectiva (manual o sugerida) del día, igual que ya se muestra en pantalla.
function tarifasTrasladoProyector(p){ if(!p.proyector.trasladoTarifas) p.proyector.trasladoTarifas={avion:0,autobus:0,uber:0,taxi_aeropuerto:0,renta_auto:0}; return p.proyector.trasladoTarifas; }
function calcularCostoTraslado(p){
  const t=sincronizarTransporteProyector(p); const tarifas=tarifasTrasladoProyector(p);
  const sugeridos=new Map(trasladoResumenProyector(p).map(x=>[x.fecha,x]));
  const totales={avion:0,autobus:0,uber:0,taxi_aeropuerto:0,renta_auto:0};
  t.dias.forEach(d=>{
    totales.avion+=num(d.avion); totales.autobus+=num(d.autobus); totales.taxi_aeropuerto+=num(d.taxi_aeropuerto); totales.renta_auto+=num(d.renta_auto);
    totales.uber += (d.uber==null||d.uber===undefined) ? ((sugeridos.get(d.fecha)||{}).total||0) : num(d.uber);
  });
  const LABEL={avion:'Avión',autobus:'Autobús',uber:'Uber',taxi_aeropuerto:'Taxi',renta_auto:'Renta de auto'};
  const detalle = Object.keys(totales).map(k=>({tipo:k, label:LABEL[k], cantidad:totales[k], tarifa:num(tarifas[k]), costo:totales[k]*num(tarifas[k])}));
  return {detalle, total: detalle.reduce((a,d)=>a+d.costo,0)};
}
function calcularHabitacionesProyector(p){
  const pl=sincronizarProyector(p);
  const n = areaK => pl.crew.filter(c=>c.area===areaK).length;
  const steel=n('steel'), eps=n('eps'), ops=n('ops');
  // El conteo sale de los cuartos reales (misma fuente que la lista por nombre), no de una fórmula aparte,
  // para que nunca se contradigan cuando alguien se mueve a mano entre cuartos.
  const {cuartos} = construirRosterHabitacionesProyector(p);
  let sencillas=0,dobles=0,cuadruples=0;
  cuartos.forEach(c=>{ if(c.tipo==='sencilla') sencillas++; else if(c.tipo==='doble') dobles++; else cuadruples++; });
  return {sencillas, dobles, cuadruples, steel, eps, ops};
}

// ---- Traslado de personal: solo cantidades (sin costo ni tarifas). Steel: cuántos viajan ese día
// (Previo o Salida, necesitan Sprinter). EPS/OPS: viajes de Uber sugeridos por día, simplificado sin
// considerar autos de renta (ese detalle queda pendiente).
function trasladoDia(p, fecha){
  const pl=sincronizarProyector(p);
  let steelViajan=0, epsCount=0, epsPrevio=0, epsSalida=0, opsViajes=0;
  pl.crew.forEach(c=>{
    const t=turnoEfectivoProyector(p,c,fecha); if(!t) return; const n=norm(t);
    if(c.area==='steel' && (n==='previo'||n==='salida')) steelViajan++;
    if(c.area==='eps'){ epsCount++; if(n==='previo') epsPrevio++; if(n==='salida') epsSalida++; }
    if(c.area==='ops'){ if(n==='previo'||n==='salida') opsViajes+=1; else opsViajes+=2; }
  });
  const epsUber = epsCount>0 ? (2*Math.ceil(epsCount/4) + epsPrevio + epsSalida) : 0;
  return {steelViajan, epsUber, opsViajes, total:epsUber+opsViajes};
}
function trasladoResumenProyector(p){
  const rango=rangoDeProyecto(p); if(!rango) return [];
  return diasDeRango(rango.ini,rango.fin).map(f=>({fecha:f, ...trasladoDia(p,f)}));
}

// ---- Combustible: lista libre de "flotillas" (Sprinters, autos de renta, lo que sea), cada una ligada
// a la área que tú elijas — ya no asume que Steel siempre viaja en Sprinter ni que Operaciones siempre
// renta auto. Aquí sí se calcula costo, porque se pidió explícitamente — el resto del traslado sigue
// siendo solo cantidades.
function nuevaFlotilla(nombre, areaId){
  return { id:uuid(), nombre:nombre||'Nueva flotilla', nombreRuta:'', areaId:areaId||null, modo:'calculadora',
    unidades:0, precio_combustible:0, tarifa_diaria:0,
    rendimiento_carretera_kml:9, rendimiento_local_kml:6.5, mantenimiento_por_km:0.05, pct_imprevistos:0.05,
    distancia_ab_km:0, casetas_ab:0, distancia_bc_km:0, casetas_bc:0, distancia_local_km:0, casetas_local:0 };
}
function sincronizarCombustibleProyector(p){
  // Migración: el combustible viejo (un solo objeto con Sprinters de Steel + auto de renta) se parte en
  // dos flotillas independientes, para no perder lo que ya estaba capturado.
  if(p.proyector.combustible && !Array.isArray(p.proyector.combustible)){
    const old=p.proyector.combustible; const flotillas=[];
    if(num(old.camionetas)>0 || num(old.distancia_ab_km)>0){
      flotillas.push(Object.assign(nuevaFlotilla('Sprinters', areaByTipo(p,'steel')?.id||null),
        {unidades:old.camionetas, precio_combustible:old.precio_diesel, rendimiento_carretera_kml:old.rendimiento_carretera_kml,
         rendimiento_local_kml:old.rendimiento_local_kml, mantenimiento_por_km:old.mantenimiento_por_km, pct_imprevistos:old.pct_imprevistos,
         distancia_ab_km:old.distancia_ab_km, casetas_ab:old.casetas_ab, distancia_bc_km:old.distancia_bc_km, casetas_bc:old.casetas_bc,
         distancia_local_km:old.distancia_local_km, casetas_local:old.casetas_local}));
    }
    if(num(old.autos_renta)>0){
      flotillas.push(Object.assign(nuevaFlotilla('Autos de renta', p.areas.find(a=>a.id==='ops')?.id||null),
        {unidades:old.autos_renta, precio_combustible:old.precio_gasolina_renta, rendimiento_local_kml:old.rendimiento_renta_auto_kml,
         distancia_local_km:old.distancia_local_km}));
    }
    p.proyector.combustible = flotillas;
  }
  if(!p.proyector.combustible) p.proyector.combustible=[];
  return p.proyector.combustible;
}
// Días de carretera (Previo/Salida) y días locales de trabajo de una área — ya genérico, no solo Steel.
function diasCarreteraYLocalDeArea(p, areaId){
  const rango = areaId ? rangoDeArea(p,areaId) : null; if(!rango) return {diasPrevio:0,diasSalida:0,diasLocal:0};
  let diasPrevio=0,diasSalida=0,diasLocal=0;
  diasDeRango(rango.ini,rango.fin).forEach(f=>{
    const tipos=new Set(); p.proyector.crew.filter(c=>c.area===areaId).forEach(c=>{ const t=turnoEfectivoProyector(p,c,f); if(t) tipos.add(norm(t)); });
    if(!tipos.size) return;
    if(tipos.has('previo')) diasPrevio++;
    if(tipos.has('salida')) diasSalida++;
    if(Array.from(tipos).some(t=>t!=='previo'&&t!=='salida')) diasLocal++;
  });
  return {diasPrevio,diasSalida,diasLocal};
}
// Días totales de renta = todo el rango del área (llegada a salida), como se rentaría un vehículo de verdad.
function diasRentaDeArea(p, areaId){
  const rango = areaId ? rangoDeArea(p,areaId) : null; if(!rango) return 0;
  return diasDeRango(rango.ini,rango.fin).length;
}
function calcularFlotilla(p, f){
  if((f.modo||'calculadora')==='renta_simple'){
    const dias=diasRentaDeArea(p,f.areaId), unidades=num(f.unidades), total=num(f.tarifa_diaria)*unidades*dias;
    return {modo:'renta_simple', dias, unidades, viajesCarretera:0, diasLocal:0, totalCarretera:0, totalLocal:total, total};
  }
  const {diasPrevio,diasSalida,diasLocal}=diasCarreteraYLocalDeArea(p, f.areaId);
  const viajesCarretera=diasPrevio+diasSalida, unidades=num(f.unidades), precio=num(f.precio_combustible), mantKm=num(f.mantenimiento_por_km), imp=num(f.pct_imprevistos);
  // Tramo A→B (siempre) y, si se captura, un segundo tramo B→C (ej. bodega → venue → un segundo punto) —
  // ambos se recorren de ida y vuelta en cada viaje de carretera (Previo o Salida).
  const litrosAB = num(f.rendimiento_carretera_kml)>0 ? num(f.distancia_ab_km)/num(f.rendimiento_carretera_kml) : 0;
  const litrosBC = num(f.rendimiento_carretera_kml)>0 ? num(f.distancia_bc_km)/num(f.rendimiento_carretera_kml) : 0;
  const distanciaCarreteraTotal = num(f.distancia_ab_km)+num(f.distancia_bc_km);
  const subCarrPorUnidad = (litrosAB+litrosBC)*precio + num(f.casetas_ab)+num(f.casetas_bc) + distanciaCarreteraTotal*mantKm;
  const costoPorViaje = subCarrPorUnidad*(1+imp)*unidades;
  const totalCarretera = costoPorViaje*viajesCarretera;
  const litrosLocalPorDia = num(f.rendimiento_local_kml)>0 ? num(f.distancia_local_km)/num(f.rendimiento_local_kml) : 0;
  const subLocalPorUnidad = litrosLocalPorDia*precio + num(f.casetas_local) + num(f.distancia_local_km)*mantKm;
  const costoPorDia = subLocalPorUnidad*(1+imp)*unidades;
  const totalLocal = costoPorDia*diasLocal;
  return {modo:'calculadora', diasPrevio,diasSalida,diasLocal,viajesCarretera,totalCarretera,totalLocal,total:totalCarretera+totalLocal};
}
function calcularCombustibleProyector(p){
  const flotillas = sincronizarCombustibleProyector(p);
  const detalle = flotillas.map(f=>({flotilla:f, calc:calcularFlotilla(p,f)}));
  const totalGeneral = detalle.reduce((a,d)=>a+d.calc.total,0);
  return {detalle, totalGeneral};
}

// ---- Captura manual de traslado por día (avión/autobús/uber/taxi/renta de auto). Uber en blanco =
// usa la sugerencia automática (misma que arriba); un número escrito la sustituye como excepción.
function sincronizarTransporteProyector(p){
  const fechas = fechasProyectoPlanner(p);
  if(!p.proyector.transporte) p.proyector.transporte = {dias:[]};
  const porFecha = new Map(p.proyector.transporte.dias.map(d=>[d.fecha,d]));
  fechas.forEach(f=>{ if(!porFecha.has(f)) p.proyector.transporte.dias.push({fecha:f, avion:0, autobus:0, uber:null, taxi_aeropuerto:0, renta_auto:0}); });
  p.proyector.transporte.dias.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return p.proyector.transporte;
}

// ---- Asignación de cuartos: automática y estable por persona (no se mueve al agregar/quitar a otras),
// con opción de unirse a mano a un cuarto existente que aún tenga lugar, o crear uno nuevo.
const CAPACIDAD_CUARTO = {sencilla:1, doble:2, cuadruple:4};
const TIPO_CUARTO_LABEL_PROY = {sencilla:'Sencilla', doble:'Doble', cuadruple:'Cuádruple'};
function tipoCuartoDeArea(p, areaK){
  if(areaK==='steel') return 'cuadruple';
  if(areaK==='eps'){ const eps=p.proyector.crew.filter(c=>c.area==='eps').length; return eps<=3?'doble':'cuadruple'; }
  return 'sencilla'; // Operaciones y cualquier área nueva: un cuarto por persona, por defecto
}
// Número de cuarto automático estable: una vez asignado, no cambia aunque entren o salgan compañeros.
function asegurarHabitacionAutoNumero(p, persona){
  if(persona.habitacion_auto_numero) return;
  const tipo = tipoCuartoDeArea(p, persona.area); if(!tipo) return;
  const cap = CAPACIDAD_CUARTO[tipo];
  const companeros = p.proyector.crew.filter(c=>c.area===persona.area && c.id!==persona.id && !c.habitacion_room_id && c.habitacion_auto_numero);
  const ocupacion={}; companeros.forEach(c=>{ ocupacion[c.habitacion_auto_numero]=(ocupacion[c.habitacion_auto_numero]||0)+1; });
  let n=1; while((ocupacion[n]||0)>=cap) n++;
  persona.habitacion_auto_numero=n;
}
function habitacionAutoDePersona(p, persona){
  const tipo=tipoCuartoDeArea(p, persona.area); if(!tipo) return null;
  asegurarHabitacionAutoNumero(p, persona);
  return persona.habitacion_auto_numero ? {tipo, roomId:'auto:'+persona.area+':'+persona.habitacion_auto_numero} : null;
}
function habitacionEfectivaProyector(p, persona){
  if(persona.habitacion_room_id){
    if(persona.habitacion_room_id.startsWith('manual:')){
      const grupo=(p.proyector.habitacionGruposManuales||{})[persona.habitacion_room_id];
      if(grupo) return {roomId:persona.habitacion_room_id, tipo:grupo.tipo, manual:true};
    } else if(persona.habitacion_room_id.startsWith('auto:')){
      const partes=persona.habitacion_room_id.split(':'); const tipo=tipoCuartoDeArea(p, partes[1]);
      if(tipo) return {roomId:persona.habitacion_room_id, tipo, manual:true};
    }
  }
  const auto=habitacionAutoDePersona(p, persona);
  return auto ? {roomId:auto.roomId, tipo:auto.tipo, manual:false} : null;
}
// Cuartos existentes con lugar disponible para "unirse a...", excluyendo a la propia persona
function cuartosParaUnirse(p, personaExcluida){
  const grupos={};
  p.proyector.crew.forEach(c=>{
    if(c.id===personaExcluida.id) return;
    const ef=habitacionEfectivaProyector(p,c); if(!ef) return;
    if(!grupos[ef.roomId]) grupos[ef.roomId]={roomId:ef.roomId, tipo:ef.tipo, nombres:[]};
    grupos[ef.roomId].nombres.push(nombrePersona(c.personaId)||'Sin nombre');
  });
  return Object.values(grupos).filter(g=>g.nombres.length < CAPACIDAD_CUARTO[g.tipo]);
}
function construirRosterHabitacionesProyector(p){
  const grupos={}, sinAsignar=[];
  p.proyector.crew.forEach(c=>{
    const ef=habitacionEfectivaProyector(p,c); const nombre=nombrePersona(c.personaId)||'Sin nombre';
    if(!ef){ sinAsignar.push(nombre); return; }
    if(!grupos[ef.roomId]) grupos[ef.roomId]={roomId:ef.roomId, tipo:ef.tipo, ocupantes:[]};
    grupos[ef.roomId].ocupantes.push({nombre, area:c.area});
  });
  const peso=a=>a==='steel'?0:(a==='eps'?1:(a==='ops'?2:3));
  const lista=Object.values(grupos).sort((a,b)=>Math.min(...a.ocupantes.map(o=>peso(o.area)))-Math.min(...b.ocupantes.map(o=>peso(o.area))));
  const porTipo={sencilla:[],doble:[],cuadruple:[]}; lista.forEach(g=>{ if(porTipo[g.tipo]) porTipo[g.tipo].push(g.ocupantes); });
  const cuartos=[]; ['sencilla','doble','cuadruple'].forEach(t=>porTipo[t].forEach((oc,i)=>cuartos.push({tipo:t, numero:i+1, ocupantes:oc})));
  return {cuartos, sinAsignar};
}
function setHabitacionManual(p, personaId, valor){
  const c=p.proyector.crew.find(x=>x.id===personaId); if(!c) return;
  if(!valor){ c.habitacion_room_id=null; }
  else if(valor.startsWith('join:')){ c.habitacion_room_id=valor.slice(5); }
  else if(valor.startsWith('nuevo:')){
    const tipo=valor.slice(6); const nuevoId='manual:'+uuid();
    if(!p.proyector.habitacionGruposManuales) p.proyector.habitacionGruposManuales={};
    p.proyector.habitacionGruposManuales[nuevoId]={tipo}; c.habitacion_room_id=nuevoId;
  }
}

const ESTATUS_REAL_TRK = [

function sincronizarTracker(p){ if(!p.tracker) p.tracker = {presupuestos:[], lineas:[], movimientos:[]}; return p.tracker; }
const lineTotalTrk = l => l.baja ? 0 : num(l.subtotal);

}
function factsDeTrk(p){

  return out;
}

/* ---------------- Mockup isométrico: boceto esquemático del escenario a partir de las medidas
   capturadas en Stage (reqSteel) y Pantallas — no es un plano preciso, es para dar una idea visual. ---------------- */
let _mockupBounds = null; // se activa durante mockupIsometricoSVG() para que el viewBox se ajuste solo
let _mockupVista = 'iso1'; // 'iso1' | 'iso2' | 'planta' | 'frente' — se fija antes de generar el SVG
const MOCKUP_VISTAS = [
  {k:'iso1', l:'Isométrico frontal'},
  {k:'iso2', l:'Isométrico opuesto'},
  {k:'planta', l:'Planta'},
  {k:'frente', l:'Frente'},
];
function isoProyectar(x,y,z,escala){
  const s=escala||16;
  let pt;
  if(_mockupVista==='planta'){
    // Vista de planta: ortográfica desde arriba — X horizontal, Y (profundidad) vertical en pantalla.
    pt = [ x*s, y*s ];
  } else if(_mockupVista==='frente'){
    // Vista de frente: ortográfica — X horizontal, Z (altura) vertical. La profundidad (Y) no se ve.
    pt = [ x*s, -z*s ];
  } else {
    // Isométrico "bajo": ángulo chico (más horizontal) para ver hacia adentro del escenario, no desde
    // arriba. "Opuesto" rota la escena 180° sobre el eje vertical (como rodear la estructura por
    // detrás) — no un espejo en X, que no se nota si la estructura es simétrica izquierda-derecha.
    const ang = Math.PI/8; // ~22.5° — bajo, para asomarse al interior en vez de ver solo el techo
    const xx = _mockupVista==='iso2' ? -x : x, yy = _mockupVista==='iso2' ? -y : y;
    pt = [ (xx-yy)*Math.cos(ang)*s, (xx+yy)*Math.sin(ang)*s - z*s ];
  }
  if(_mockupBounds){
    if(pt[0]<_mockupBounds.minX) _mockupBounds.minX=pt[0];
    if(pt[0]>_mockupBounds.maxX) _mockupBounds.maxX=pt[0];
    if(pt[1]<_mockupBounds.minY) _mockupBounds.minY=pt[1];
    if(pt[1]>_mockupBounds.maxY) _mockupBounds.maxY=pt[1];
  }
  return pt;
}
function isoPts(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }
function gridLineas(bays, medio){
  const pos=[0]; let acc=0;
  for(let i=0;i<bays;i++){ acc+=bayFull(); pos.push(acc); }
  if(medio){ acc+=bayMedio(); pos.push(acc); }
  return pos;
}
function nivelesAltura(alturaTotal, modulo){
  modulo=modulo||2; const niveles=[0]; let z=0;
  if(alturaTotal<=0) return [0];
  while(z<alturaTotal-0.001){ z=Math.min(z+modulo, alturaTotal); niveles.push(z); }
  return niveles;
}
// Dibuja la retícula de un módulo (postes, ledgers y diagonales) a partir de sus medidas reales en
// bays (X/Y) y secciones de 2m (Z) — no una caja sólida, sino el andamio bay por bay.
function contornoSimple(x0,y0,z0, baseM, profM, alturaM, color, escala){
  // Para planta/frente: la retícula completa (con todas sus diagonales en 3 ejes) se volvería un
  // enredo ilegible al aplanarse a 2D sin profundidad — aquí basta el contorno, como en un plano técnico.
  const P=(x,y,z)=>isoProyectar(x0+x,y0+y,z0+z,escala);
  let a,b,c,d;
  if(_mockupVista==='planta'){ a=P(0,0,0); b=P(baseM,0,0); c=P(baseM,profM,0); d=P(0,profM,0); }
  else { a=P(0,0,0); b=P(baseM,0,0); c=P(baseM,0,alturaM); d=P(0,0,alturaM); }
  const pts=[a,b,c,d].map(pt=>pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ');
  return {svg:`<polygon points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/>`, w:baseM, d:profM, h:alturaM};
}
function reticulaModulo(x0,y0,z0, baseM, profM, alturaM, color, escala, grosor){
  grosor = grosor||1;
  const P=(x,y,z)=>isoProyectar(x0+x,y0+y,z0+z,escala);
  const xb=snapBay(baseM), yb=snapBay(Math.max(profM,0.01));
  const xs=gridLineas(xb.bays, xb.medio), ys=gridLineas(yb.bays, yb.medio);
  const zs=nivelesAltura(alturaM, 2);
  const L=(a,b,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${color}" stroke-width="${w||1}"/>`;
  let out='';
  for(let zi=0; zi<zs.length-1; zi++){ xs.forEach(x=>ys.forEach(y=>{ out+=L(P(x,y,zs[zi]),P(x,y,zs[zi+1]),1*grosor); })); }
  zs.forEach(z=>{
    for(let i=0;i<xs.length-1;i++) ys.forEach(y=>{ out+=L(P(xs[i],y,z),P(xs[i+1],y,z),1*grosor); });
    for(let j=0;j<ys.length-1;j++) xs.forEach(x=>{ out+=L(P(x,ys[j],z),P(x,ys[j+1],z),1*grosor); });
  });
  for(let zi=0; zi<zs.length-1; zi++){
    const z1=zs[zi], z2=zs[zi+1];
    for(let i=0;i<xs.length-1;i++){
      const alt=(zi+i)%2===0;
      out+=L(P(xs[i],0,alt?z1:z2),P(xs[i+1],0,alt?z2:z1),0.6*grosor);
      out+=L(P(xs[i],ys[ys.length-1],alt?z1:z2),P(xs[i+1],ys[ys.length-1],alt?z2:z1),0.6*grosor);
    }
    for(let j=0;j<ys.length-1;j++){
      const alt=(zi+j)%2===0;
      out+=L(P(0,ys[j],alt?z1:z2),P(0,ys[j+1],alt?z2:z1),0.6*grosor);
      out+=L(P(xs[xs.length-1],ys[j],alt?z1:z2),P(xs[xs.length-1],ys[j+1],alt?z2:z1),0.6*grosor);
    }
  }
  return {svg:out, w:xs[xs.length-1], d:ys[ys.length-1], h:zs[zs.length-1]};
}
// Pantallas: a diferencia de Steel (bays), se arman en módulos fijos de 1x1 m, con un grosor
// delgado (máx. 0.5 m) — se dibuja como un panel con su rejilla de módulos, no con bays.
function reticulaPantalla(x0,y0,z0, anchoM, altoM, color, escala){
  // Panel SÓLIDO (relleno, no solo rejilla) para que nunca se confunda ni se pierda detrás de otra
  // estructura — con las líneas de los módulos de 1x1 m encima, para que se note que está armada en piezas.
  const prof = 0.5;
  const P=(x,y,z)=>isoProyectar(x0+x,y0+y,z0+z,escala);
  const nx = Math.max(1, Math.round(anchoM||1)), nz = Math.max(1, Math.round(altoM||1));
  const pts = arr=>arr.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const front=[P(0,0,0),P(nx,0,0),P(nx,0,nz),P(0,0,nz)];
  const side=[P(nx,0,0),P(nx,prof,0),P(nx,prof,nz),P(nx,0,nz)];
  const top=[P(0,0,nz),P(nx,0,nz),P(nx,prof,nz),P(0,prof,nz)];
  let out = `<polygon points="${pts(top)}" fill="${color}" opacity="0.65" stroke="#111" stroke-width="0.8"/>
    <polygon points="${pts(side)}" fill="${color}" opacity="0.8" stroke="#111" stroke-width="0.8"/>
    <polygon points="${pts(front)}" fill="${color}" stroke="#111" stroke-width="1"/>`;
  const L=(a,b,c)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="0.6"/>`;
  const borde='#1a1a1a';
  for(let i=1;i<nx;i++) out+=L(P(i,0,0),P(i,0,nz),borde);
  for(let k=1;k<nz;k++) out+=L(P(0,0,k),P(nx,0,k),borde);
  return {svg:out, w:nx, d:prof, h:nz};
}
// Diagnóstico del mockup: dice exactamente qué encontró (o no) para que no haya que adivinar por qué
// algo no aparece — en vez de solo "no se ve", esto dice "no se ve PORQUE...".
// Componentes del mockup, agrupados por área (Steel, Pantallas, y lo que se vaya agregando después
// — Audio, etc.) en vez de una lista plana, para que se lea de un vistazo qué trae cada área.
function diagnosticoMockup(p){
  const grupos = [];
  const steel = p.reqSteel||[];
  const porProducto = k => steel.find(r=>r.producto===k);
  const steelArea = areaById('steel');
  const lineasSteel = [];
  const stageItem = porProducto('escenario');
  if(!stageItem) lineasSteel.push({ok:false, txt:'No hay fila de "Escenario" en Stage — el mockup usa 8.28 x 6.21 x 16 m por default.'});
  else if(!Number(stageItem.base)||!Number(stageItem.profundidad)||!Number(stageItem.altura)) lineasSteel.push({ok:false, txt:'Escenario: le falta Base, Profundidad o Altura — revisa esos 3 campos.'});
  else lineasSteel.push({ok:true, txt:`Escenario — ${stageItem.base} x ${stageItem.profundidad} x ${stageItem.altura} m.`});
  [['wings','Wings'],['roof','Roof System'],['loading_dock','Loading Dock'],['foh','FOH'],['camaras','Estructuras para cámaras']].forEach(([k,nombre])=>{
    const it=porProducto(k);
    if(it && Number(it.base)) lineasSteel.push({ok:true, txt:`${nombre} — ${it.base} x ${it.profundidad||'—'} x ${it.altura||'—'} m.`});
  });
  grupos.push({area: (steelArea&&steelArea.nombre)||'Estructuras Temporales', lineas: lineasSteel});

  const areaPantallas = C().areas.find(a=>norm(a.nombre)===norm('Pantallas'));
  const areaPantallasProy = p.areas.find(a=>norm(a.nombre)===norm('Pantallas'));
  const lineasPantallas = [];
  if(!areaPantallas) lineasPantallas.push({ok:false, txt:'No existe un área "Pantallas" en el catálogo de Configuración (o se renombró) — el mockup la busca por ese nombre exacto.'});
  else if(!areaPantallasProy) lineasPantallas.push({ok:false, txt:'El catálogo tiene "Pantallas", pero este proyecto no tiene esa área agregada — agrégala en "Áreas y calendario".'});
  else {
    const gruposP = p.reqGenericoGrupos[areaPantallasProy.id]||[];
    let totalItems=0;
    gruposP.forEach(g=>{ g.items.forEach(it=>{
      totalItems++;
      if(it.ancho) lineasPantallas.push({ok:true, txt:`${g.nombre} — ${it.ancho}x${it.alto||'—'} m.`});
    }); });

function mockupIsometricoSVG(p, vista){
  _mockupVista = vista || 'iso1';
  _mockupBounds = {minX:Infinity, maxX:-Infinity, minY:Infinity, maxY:-Infinity};
  const steel = p.reqSteel||[];
  const porProducto = k => steel.find(r=>r.producto===k);
  const n = v=>Number(v)||0;
  const ESC=9;
  const stageItem = porProducto('escenario');
  const stageBase=n(stageItem&&stageItem.base)||8.28, stageProf=n(stageItem&&stageItem.profundidad)||6.21, stageAlt=n(stageItem&&stageItem.altura)||16;
  // En vez de un orden fijo de dibujo (que nunca puede ser correcto para todos los cruces a la vez),
  // cada pieza se guarda con su posición central en el espacio 3D, y al final se ordenan de la más
  // lejana a la más cercana antes de pintarlas — así lo que está genuinamente más al frente queda
  // visualmente al frente, sin importar en qué orden se haya capturado en el Brief.
  const capas = [];
  const profundidad = (cx,cy,cz) => {
    if(_mockupVista==='planta') return cz; // en planta, lo más alto se pinta al final (se ve "desde arriba")
    if(_mockupVista==='frente') return cy; // en frente (viendo como el público, hacia el escenario), lo
    // más cercano al público (y grande, como los Wings) se pinta al final — lo de atrás (Loading Dock,
    // y chica/negativa) se pinta primero. Antes estaba al revés y la vista de frente se veía como trasera.
    // La cámara de estas vistas mira principalmente a lo largo del eje Y (de "atrás" hacia el público).
    // Por eso la profundidad real depende SOLO de Y: qué tan atrás o adelante está algo en ese eje.
    // Ni la altura (Z, ya se quitó antes) ni la posición lateral (X) deberían decidir qué está "al
    // frente" — si se suma X, algo que está muy a la izquierda (como el Wing izquierdo, X bien negativa)
    // sale con profundidad "falsamente baja" aunque en Y esté claramente al frente de la pantalla.
    return _mockupVista==='iso2' ? -cy : cy;
  };
  const agregar = (svg, cx,cy,cz, etiqueta) => {
    if(!svg) return;
    const wrapped = etiqueta ? `<g><title>${esc(etiqueta)}</title>${svg}</g>` : svg;
    capas.push({svg:wrapped, depth: profundidad(cx,cy,cz)});
  };

  const stage = reticulaModulo(0,0,0, stageBase,stageProf,stageAlt, '#555', ESC);
  agregar(stage.svg, stageBase/2, stageProf/2, stageAlt/2, `Escenario — ${stageBase.toFixed(2)} x ${stageProf.toFixed(2)} x ${stageAlt.toFixed(2)} m`);

  let alturaWings = stage.h;
  let wingInfo = null;
  const wings = porProducto('wings');
  if(wings && n(wings.base)){
    // El paño frontal del escenario (donde está el público) es el borde y=profundidad en esta
    // proyección — los Wings van ahí, flanqueando los dos extremos en X, pegados a ese borde.
    const ww=n(wings.base), wd=n(wings.profundidad)||1.5, wh=n(wings.altura)||stage.h;
    const wy = stage.d-wd;
    const left = reticulaModulo(-ww,wy,0, ww,wd,wh, '#2f6fa8', ESC);
    const right = reticulaModulo(stage.w,wy,0, ww,wd,wh, '#2f6fa8', ESC);
    agregar(left.svg, -ww/2, wy+wd/2, wh/2, `Wing izquierdo — ${ww.toFixed(2)} x ${wd.toFixed(2)} x ${wh.toFixed(2)} m`);
    agregar(right.svg, stage.w+ww/2, wy+wd/2, wh/2, `Wing derecho — ${ww.toFixed(2)} x ${wd.toFixed(2)} x ${wh.toFixed(2)} m`);
    alturaWings = wh;
    wingInfo = {ww,wd,wh,wy, leftX:-ww, rightX:stage.w};
  }
  const roof = porProducto('roof');
  if(roof){
    // El roof siempre va sobre el escenario, empieza a la altura final de los Wings, y mide 1.5 m de alto fijo.
    const rw=n(roof.base)||stage.w, rd=n(roof.profundidad)||stage.d;
    const rx = (stage.w-rw)/2, ry=(stage.d-rd)/2;
    const rsvg = reticulaModulo(rx,ry,alturaWings, rw,rd,1.5, '#b8860b', ESC).svg;
    agregar(rsvg, rx+rw/2, ry+rd/2, alturaWings+0.75, `Roof System — ${rw.toFixed(2)} x ${rd.toFixed(2)} x 1.50 m`);
  }
  const dock = porProducto('loading_dock');
  if(dock && n(dock.base)){

    // extendiéndose hacia atrás (y negativa).
    const dw=n(dock.base), dd=n(dock.profundidad)||3, dh=n(dock.altura)||1.5;
    const dsvg = reticulaModulo((stage.w-dw)/2, -dd, 0, dw,dd,dh, '#a85c3c', ESC).svg;
    agregar(dsvg, stage.w/2, -dd/2, dh/2, `Loading Dock — ${dw.toFixed(2)} x ${dd.toFixed(2)} x ${dh.toFixed(2)} m`);
  }
  // FOH y plataformas para cámaras: siempre frente al escenario (más allá del paño frontal, separados
  // ~20 m de ese borde), con las cámaras flanqueando al FOH a los lados — una a la izquierda, otra a la
  // derecha. En la vista de Frente se omiten — están lejos del escenario y solo estorban esa vista.
  const fohItem = _mockupVista==='frente' ? null : steel.find(r=>r.producto==='foh');
  const camItems = _mockupVista==='frente' ? [] : steel.filter(r=>r.producto==='camaras');
  const yFrente = stage.d + 20;
  let fohCenterX = stage.w/2, fohW = 0;
  if(fohItem && n(fohItem.base)){
    fohW = n(fohItem.base); const fd=n(fohItem.profundidad)||4, fh=n(fohItem.altura)||3;
    const fsvg = reticulaModulo(fohCenterX-fohW/2, yFrente, 0, fohW,fd,fh, '#4e8f5c', ESC).svg;
    agregar(fsvg, fohCenterX, yFrente+fd/2, fh/2, `FOH — ${fohW.toFixed(2)} x ${fd.toFixed(2)} x ${fh.toFixed(2)} m`);
  }
  // Cada fila respeta su "Cantidad" — si capturaste 2, se dibujan 2 plataformas aunque sea una sola fila.
  const camInstancias = [];
  camItems.forEach(item=>{ if(!n(item.base)) return; const cant=Math.max(1, Math.round(n(item.cantidad))||1); for(let k=0;k<cant;k++) camInstancias.push(item); });
  camInstancias.forEach((item,i)=>{
    const cw=n(item.base), cd=n(item.profundidad)||2, ch=n(item.altura)||3;
    const lado = i%2===0 ? -1 : 1; // primera a la izquierda del FOH, segunda a la derecha, y así alternando
    const parIdx = Math.floor(i/2);
    const offset = fohW/2 + 2 + parIdx*(cw+2) + cw/2;
    const cx = fohCenterX + lado*offset;
    const csvg = reticulaModulo(cx-cw/2, yFrente, 0, cw,cd,ch, '#4e8f5c', ESC).svg;
    agregar(csvg, cx, yFrente+cd/2, ch/2, `Estructura para cámaras — ${cw.toFixed(2)} x ${cd.toFixed(2)} x ${ch.toFixed(2)} m`);
  });
  // OJO: hay que usar el id del área TAL COMO VIVE EN ESTE PROYECTO (p.areas), no el id que tenga
  // "Pantallas" en el catálogo global — pueden no coincidir si el área se agregó antes de unificar
  // el catálogo, y p.reqGenericoGrupos está indexado por el id del proyecto, no el del catálogo.
  const areaPantallasProy = p.areas.find(a=>norm(a.nombre)===norm('Pantallas'));
  if(areaPantallasProy){
    const grupos = p.reqGenericoGrupos[areaPantallasProy.id]||[];
    let offOnstage=0, offD=0;
    grupos.forEach(g=>{
      const nombre = norm(g.nombre);
      g.items.forEach(it=>{
        if(!it.ancho) return;
        const pw=Math.max(1,Math.round(n(it.ancho))), ph=Math.max(1,Math.round(n(it.alto)||3));
        const COLOR_PANTALLA = '#3a3a3a';
        if(nombre.includes('central')){
          // Dentro del stage, hacia el fondo (el lado opuesto a los Wings); su borde superior
          // empieza 1 m abajo del borde inferior del roof, y de ahí cuelga hacia abajo. Conceptualmente
          // vive DENTRO del "cubo" que forman Stage+Wings+Roof, así que siempre se dibuja antes que esos
          // tres (profundidad forzada al mínimo) — no depende del cálculo genérico por centroide, porque
          // al ser una pieza ancha y delgada, su centro no representa bien si una esquina se cruza con otra pieza.
          const topZ = Math.max(1, alturaWings-1), botZ = Math.max(0, topZ-ph);
          const r = reticulaPantalla(stage.w/2-pw/2, 0.25, botZ, pw,topZ-botZ, COLOR_PANTALLA, ESC);
          agregar(r.svg, stage.w/2, 0.25+r.d/2, (topZ+botZ)/2, `Pantalla Central — ${pw}x${ph} m`);
        } else if(nombre.includes('imag')){
          // Siempre en par, una sobre cada Wing, centradas a su ancho; el borde superior empieza
          // 1 m abajo de la altura máxima del Wing, sobre la cara frontal (la que da hacia el público).
          if(wingInfo){
            // Siempre AL FRENTE del Wing (nunca empotrada) — se separa un poco de su cara frontal,
            // y se fuerza a dibujarse al final para que nunca quede visualmente detrás de su lattice.
            const topZ = Math.max(1, wingInfo.wh-1), botZ = Math.max(0, topZ-ph);
            const py = wingInfo.wy+wingInfo.wd+0.4;
            [wingInfo.leftX, wingInfo.rightX].forEach(wx=>{
              const r = reticulaPantalla(wx+wingInfo.ww/2-pw/2, py, botZ, pw,topZ-botZ, COLOR_PANTALLA, ESC);

            });
          }
        } else if(nombre.includes('on-stage')||nombre.includes('onstage')){
          const px = offOnstage%2===0 ? -pw-0.5 : stage.w+0.5;
          const r = reticulaPantalla(px, 0.3, 0, pw,ph, COLOR_PANTALLA, ESC);
          agregar(r.svg, px+pw/2, 0.3+r.d/2, ph/2, `Pantalla On-Stage — ${pw}x${ph} m`); offOnstage++;
        } else if(nombre.includes('delay')){
          const py = yFrente+10+offD*(pw+2);
          const r = reticulaPantalla(stage.w/2-pw/2, py, 0, pw,ph, COLOR_PANTALLA, ESC);
          agregar(r.svg, stage.w/2, py+r.d/2, ph/2, `Pantalla Delay — ${pw}x${ph} m`); offD++;
        } else {
          const r = reticulaPantalla(stage.w+6, stage.d*0.3, 0, pw,ph, COLOR_PANTALLA, ESC);
          agregar(r.svg, stage.w+6+pw/2, stage.d*0.3+r.d/2, ph/2, `Pantalla — ${pw}x${ph} m`);
        }
      });

  capas.sort((a,b)=>a.depth-b.depth);
  const piezas = capas.map(c=>c.svg).join('');
  const b = _mockupBounds;
  const pad = 40;
  let vb = '-420 -480 1100 760'; // respaldo por si no se dibujó nada
  if(b && isFinite(b.minX)){
    const x0=b.minX-pad, y0=b.minY-pad, w=(b.maxX-b.minX)+pad*2, h=(b.maxY-b.minY)+pad*2;
    vb = `${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}`;
  }
  _mockupBounds = null;
  return `<svg viewBox="${vb}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">${piezas}</svg>`;
}
// ---- Plantillas de área: catálogo de sub-grupos/rubros que se precargan solos cuando el nombre del área
// coincide (ej. "Audio" -> PA, Monitoreo, RF, Sistemas). Vive en C() porque es compartido entre proyectos,
// igual que Áreas o Puestos de pago.
function nuevoSubgrupoReq(nombre){ return { id:uuid(), nombre:nombre||'Nuevo grupo', items:[] }; }
function nuevoReqSteel(producto){ return {id:uuid(), producto, base:'', altura:'', profundidad:'', cantidad:1, descripcion:'', notas:''}; }
function nuevoReqDelay(){ return {id:uuid(), tipo:'heavy', altura:'', cantidad:1}; }
function nuevoReqPanel(producto){ return {id:uuid(), producto, m2:''}; }
function nuevoReqCable(){ return {id:uuid(), metrosLineales:'', lineasParalelas:1, incluirRampas:true}; }

/* ---------------- Fechas por área y rango ocupado ---------------- */
// Si un área no tiene fechas propias, hereda las globales del proyecto
function fechasDeArea(p, areaK){ return p.fechasPorArea[areaK] || p.fechas; }
// Tipo de un día: lo que el usuario haya fijado a mano, si no la fórmula automática (Previo/Montaje/Show/Desmontaje/Salida)
function tipoAutoDia(f, iso){
  if(iso===f.llegada) return 'Previo'; if(iso===f.loadOut) return 'Salida'; if(iso===f.showday) return 'Show';
  return f.showday && iso<f.showday ? 'Montaje' : (f.showday ? 'Desmontaje' : 'Montaje');
}
function tipoDia(f, iso){ return (f.tiposPorDia && f.tiposPorDia[iso]) || tipoAutoDia(f, iso); }
// Previo y Salida son, en la práctica, los días de viaje del crew (ida y regreso) — un solo concepto
// de "día de viaje" para efectos de transporte/hospedaje, no dos tipos nuevos aparte de los que ya existen.
function esDiaDeViaje(f, iso){ const t=norm(tipoDia(f, iso)); return t==='previo' || t==='salida'; }
function viajeDe(f, iso){ return (f.viajesPorDia && f.viajesPorDia[iso]) || {tipo:'',linea:'',numero:'',salida:'',origen:'',destino:'',link:''}; }
function hotelDe(f){ return f.hotel || {nombre:'',direccion:'',checkin:'',checkout:'',notas:''}; }
// Turno de un día: 'doble' (día y noche, el default de siempre) o 'unico' (una sola columna). Se guarda
// junto al tipo de día, por proyecto o por área si esa área tiene fechas propias.
function turnoDia(f, iso){ return (f.turnosPorDia && f.turnosPorDia[iso]) || 'doble'; }
function esTurnoDoble(p, iso){ return turnoDia(p.fechas, iso)!=='unico'; }
function diasDeRango(ini, fin){
  const dias=[]; let d=new Date(ini+'T00:00:00'); const f=new Date(fin+'T00:00:00');
  while(d<=f && dias.length<60){ dias.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return dias;
}
// "Ocupado" = desde el Previo (llegada) hasta la Salida (loadOut) del área, sin importar días intermedios
function rangoDeArea(p, areaK){ const f=fechasDeArea(p,areaK); return (f.llegada && f.loadOut) ? {ini:f.llegada, fin:f.loadOut} : null; }
// Rango que cubre todas las áreas del proyecto (llegada más temprana a salida más tardía) — ya no hay un
// rol "PM" aparte; se usa solo como respaldo si alguna área no tiene fechas propias.
function rangoDeProyecto(p){
  const rangos = p.areas.map(a=>rangoDeArea(p,a.id)).filter(Boolean);
  if(!rangos.length){ return (p.fechas.llegada && p.fechas.loadOut) ? {ini:p.fechas.llegada, fin:p.fechas.loadOut} : null; }
  return {ini: rangos.map(r=>r.ini).sort()[0], fin: rangos.map(r=>r.fin).sort().slice(-1)[0]};
}
// Traslape real: tocar el mismo día (salida de uno = llegada del otro) SÍ está permitido, es el traslado habitual
function seTraslapan(a,b){ return a && b && a.ini < b.fin && b.ini < a.fin; }

/* ---------------- Motor de disponibilidad ---------------- */
// Todas las asignaciones (persona, área, proyecto, rango) vigentes, salvo canceladas
function todasLasAsignaciones(excluirProyectoId){
  const out=[];
  state.proyectos.forEach(p=>{
    if(p.estado==='cancelado') return; if(p.id===excluirProyectoId) return;
    Object.entries(p.responsablesPorArea||{}).forEach(([areaId,r])=>{
      if(!r || !r.personaId) return;
      const rango=rangoDeArea(p,areaId); if(!rango) return;
      out.push({personaId:r.personaId, areaId, proyecto:p, rango});
    });
  });
  return out;
}
// Cruza todas las asignaciones entre sí (sin excluir ningún proyecto) para el dashboard de Home:
// pares de (proyecto, área) de la misma persona cuyas fechas se traslapan.
function detectarConflictosGlobales(){
  const todas = todasLasAsignaciones();
  const conflictos = []; const vistos = new Set();
  for(let i=0;i<todas.length;i++){
    for(let j=i+1;j<todas.length;j++){
      const a=todas[i], b=todas[j];
      if(a.personaId!==b.personaId || a.proyecto.id===b.proyecto.id) continue;
      if(!seTraslapan(a.rango,b.rango)) continue;
      const key=[a.personaId,a.proyecto.id,b.proyecto.id].sort().join('|');
      if(vistos.has(key)) continue; vistos.add(key);
      conflictos.push({personaId:a.personaId, a, b});
    }
  }
  return conflictos;
}
// Choques de una persona contra un rango propuesto, en cualquier otro proyecto (cualquier área)
function choquesDe(personaId, rango, excluirProyectoId){
  if(!personaId || !rango) return [];
  return todasLasAsignaciones(excluirProyectoId).filter(a=>a.personaId===personaId && seTraslapan(a.rango, rango));
}
function personasDeArea(areaK){ return state.roster.filter(p=>p.activo && p.area===areaK); }
// Para el desplegable: cada candidato con su estatus de disponibilidad frente al rango propuesto de ESTA área
// Solo gente cuya área del Roster coincide con el área del proyecto (por nombre, no por id — las áreas
// de un proyecto pueden ser personalizadas con un id propio, como "Audio", sin relación directa con el
// catálogo de áreas del Roster salvo que compartan nombre). Alguien de Steel no debe salir como candidato
// para Site, y viceversa. Si ya hay un responsable asignado que dejó de calificar (p. ej. cambiaron su área
// después), se mantiene en la lista para no perder el dato, marcado aparte.
function candidatosConDisponibilidad(p, areaId, personaActualId){
  const area = areaByIdProy(p, areaId); const nombreArea = area ? norm(area.nombre) : '';
  const rango = rangoDeArea(p, areaId);
  // Primero intenta por id (cubre steel/eps/ops/general aunque el área se haya renombrado en este proyecto,
  // ej. "EPS" → "Site Infrastructure" sigue siendo id:'eps'); si no, cae a comparar por nombre (para áreas
  // nuevas con id propio, como "Audio", cuando el Roster también tiene una entrada con ese mismo nombre).
  const califica = x => x.area===areaId || norm(areaNombre(x.area))===nombreArea;
  const lista = state.roster.filter(x=>x.activo && (califica(x) || x.id===personaActualId));
  return lista.map(persona=>{
    const choques = rango ? choquesDe(persona.id, rango, p.id) : [];
    return {persona, libre: choques.length===0, choques};
  }).sort((a,b)=> norm(a.persona.nombre).localeCompare(norm(b.persona.nombre),'es'));
}
function nombrePersona(id){ const p=state.roster.find(x=>x.id===id); return p ? p.nombre : null; }
// Total de líneas de requerimiento capturadas, sumando todas las secciones (Steel, Delay, EPS, barricada, cable, otros)
function totalRequerimientos(p){
  const nBarricada = Object.values(p.reqBarricada||{}).filter(n=>Number(n)>0).length;
  const nGenerico = Object.values(p.reqGenerico||{}).reduce((a,arr)=>a+(Array.isArray(arr)?arr.length:0),0);
  const nGrupos = Object.values(p.reqGenericoGrupos||{}).reduce((a,grupos)=>a+grupos.reduce((b,g)=>b+g.items.length,0),0);
  return nGenerico + nGrupos + p.reqSteel.length + p.reqDelay.length + p.reqPanel.length + nBarricada + p.reqCable.length;
}

/* ---------------- CSV de resumen ---------------- */
// Mapa fecha->tipo para un rango de fechas (usa overrides + fórmula automática)
function calendarioMapa(f){ if(!f.llegada||!f.loadOut) return {}; const out={}; diasDeRango(f.llegada,f.loadOut).forEach(iso=>{ out[iso]=tipoDia(f,iso); }); return out; }
// Lo que necesita el Proyector: identidad, rango global (para el PM) y el calendario de cada área
// habilitada — de ahí sale la plantilla de turnos por persona y, con ella, el pago por punto.
function exportarProyeccionBrief(){
  const p=getProyecto();
  const rg=rangoDeProyecto(p);
  const data={app:'marabunta-proyeccion', version:1, exportedAt:new Date().toISOString(),
    evento:{eventoId:p.eventoId, artista:p.artista, cliente:p.cliente, ciudad:p.ciudad, venue:p.venue,
      llegada: rg?rg.ini:p.fechas.llegada, loadOut: rg?rg.fin:p.fechas.loadOut},
    responsables: Object.fromEntries(p.areas.map(a=>[a.id, nombrePersona((p.responsablesPorArea[a.id]||{}).personaId)])),
    calendario:{ global: calendarioMapa(p.fechas) }
  };
  p.areas.forEach(a=>{ data.calendario[a.id] = calendarioMapa(fechasDeArea(p,a.id)); });
  descargar((p.eventoId||'proyecto')+'_proyeccion.json', JSON.stringify(data,null,1));
}

function csvResumen(){
  const H=['ID de evento','Artista','Cliente','Venue','Ciudad','Estado','Llegada','Showday','Salida','Responsables','Líneas de requerimientos'];
  const esc2=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows = state.proyectos.map(p=>{ const r=rangoDeProyecto(p); const resp=p.areas.map(a=>{ const rp=p.responsablesPorArea[a.id]; return rp&&rp.personaId ? `${a.nombre}: ${nombrePersona(rp.personaId)||''}` : ''; }).filter(Boolean).join(' / '); return [p.eventoId,p.artista,p.cliente,p.venue,p.ciudad,(ESTADOS.find(e=>e.k===p.estado)||{}).l,r?r.ini:'',p.fechas.showday,r?r.fin:'',resp,totalRequerimientos(p)]; });
  return H.join(',')+'\n'+rows.map(r=>r.map(esc2).join(',')).join('\n')+'\n';
}

/* ---------------- UI helpers ---------------- */
let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------------- Modal propio: reemplaza prompt()/confirm() del navegador, que no funcionan
   dentro del iframe donde vive el artefacto publicado. Mismo resultado, pero con un callback
   en vez de un valor de retorno inmediato, porque abrir y cerrar el modal no es instantáneo. ---------------- */
function cerrarModal(){ const ov=document.getElementById('modal-overlay'); if(ov) ov.remove(); }
function pedirTexto(titulo, cb, valorInicial, placeholder){
  cerrarModal();
  const ov=document.createElement('div'); ov.id='modal-overlay'; ov.className='modal-overlay';
  ov.innerHTML = `<div class="modal-box">
    <h3>${esc(titulo)}</h3>
    <input type="text" id="modal-input" value="${esc(valorInicial||'')}" placeholder="${esc(placeholder||'')}" autocomplete="off">
    <div class="modal-actions"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-solid" id="modal-ok">Aceptar</button></div></div>`;
  document.body.appendChild(ov);
  const input=document.getElementById('modal-input'); input.focus(); input.select();
  const aceptar=()=>{ const v=input.value.trim(); cerrarModal(); if(v) cb(v); };
  document.getElementById('modal-ok').onclick=aceptar;
  document.getElementById('modal-cancel').onclick=cerrarModal;
  input.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); aceptar(); } if(e.key==='Escape') cerrarModal(); };
  ov.onclick=(e)=>{ if(e.target===ov) cerrarModal(); };
}
function pedirSeleccion(titulo, opciones, cb){
  cerrarModal();
  const ov=document.createElement('div'); ov.id='modal-overlay'; ov.className='modal-overlay';
  ov.innerHTML = `<div class="modal-box">
    <h3>${esc(titulo)}</h3>
    <div class="modal-lista">${opciones.length?opciones.map(o=>`<button class="modal-opcion" data-v="${esc(o.id)}">${esc(o.label)}</button>`).join(''):'<p class="muted small">No hay opciones disponibles.</p>'}</div>
    <div class="modal-actions"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.modal-opcion').forEach(btn=>{ btn.onclick=()=>{ const v=btn.getAttribute('data-v'); cerrarModal(); cb(v); }; });
  document.getElementById('modal-cancel').onclick=cerrarModal;
  ov.onclick=(e)=>{ if(e.target===ov) cerrarModal(); };
}
function pedirConfirmacion(mensaje, cb, textoBoton){
  cerrarModal();
  const ov=document.createElement('div'); ov.id='modal-overlay'; ov.className='modal-overlay';
  ov.innerHTML = `<div class="modal-box">
    <p>${esc(mensaje)}</p>
    <div class="modal-actions"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-danger" id="modal-ok">${esc(textoBoton||'Confirmar')}</button></div></div>`;
  document.body.appendChild(ov);
  document.getElementById('modal-ok').onclick=()=>{ cerrarModal(); cb(); };
  document.getElementById('modal-cancel').onclick=cerrarModal;
  ov.onclick=(e)=>{ if(e.target===ov) cerrarModal(); };
  document.addEventListener('keydown', function esc1(e){ if(e.key==='Escape'){ cerrarModal(); document.removeEventListener('keydown',esc1); } });
}
// En un artifact publicado, los <a download> no disparan nada (queda inerte); ahí se usa la
// capability "downloads". Si se abre como archivo suelto (sin window.claude), se usa el método normal.
async function descargar(nombre, texto, tipo){
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads');
      if(downloads){ const r = await downloads.save({filename: nombre, data: texto}); if(r!==false) return; }
    }
  }catch(e){}
  const b=new Blob([texto],{type:tipo||'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function commit(fn){ fn(); const p=getProyecto(); if(p) p.updatedAt=Date.now(); persistProyectos(p ? p.id : undefined); setTimeout(renderKeepFocus,0); }
function renderKeepFocus(){
  const ae=document.activeElement; const key=(ae&&ae.dataset)?ae.dataset.k:null;
  const sy=window.scrollY;
  render();
  window.scrollTo(0,sy);
  if(key){ const el=document.querySelector(`[data-k="${key}"]`); if(el){ el.focus(); if(el.tagName==='INPUT'){ try{ el.select(); }catch(e){} } } }
}
async function toggleTheme(){ state.theme = state.theme==='light'?'dark':'light'; document.body.classList.toggle('theme-light', state.theme==='light'); try{ await Store.set('ui-theme', state.theme); }catch(e){} render(); }
function ir(v){ state.view=v; state.editId=null; state.mostrarNuevo=false; render(); window.scrollTo(0,0); }

function shellHTML(){
  const v=state.view;
  const items = `<button class="btn btn-solid btn-nav-grande${(v==='proyectos'||v==='proyecto')?' active-view':''}" onclick="ir('proyectos')">Proyectos</button>
      <button class="btn btn-ghost${v==='roster'?' active-view':''}" onclick="ir('roster')">Roster</button>
      <button class="btn btn-ghost${(v==='giras'||v==='gira')?' active-view':''}" onclick="ir('giras')">Giras</button>
      <button class="btn btn-ghost${(v==='venues'||v==='venue')?' active-view':''}" onclick="ir('venues')">Venues</button>
      <button class="btn btn-ghost${(v==='planes'||v==='plan')?' active-view':''}" onclick="ir('planes')">Documentación</button>
      <button class="btn btn-ghost${v==='config'?' active-view':''}" onclick="ir('config')">Configuración</button>
      <button class="btn btn-ghost${v==='respaldo'?' active-view':''}" onclick="ir('respaldo')">Respaldo</button>
      <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">${state.theme==='light'?'🌙':'☀️'}</button>`;
  return `<div class="topbar">
    <a href="#" class="brand" onclick="ir('home');return false" title="Ir a Home"><div class="brand-logo">${BRAND_LOGO_SVG}</div><div><div class="brand-sub">Producción de eventos en vivo</div></div></a>
    <div class="hover-reveal">
      <span class="hover-handle" title="Menú">☰</span>
      <div class="hover-items">${items}</div>
    </div></div>`;
}
function render(){
  const app=document.getElementById('app');
  app.innerHTML = shellHTML()+'<div class="container" id="main"></div><footer>Marabunta · Datos guardados localmente en este navegador</footer>';
  const m=document.getElementById('main');
  const tb=document.querySelector('.topbar'); if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight+'px');
  if(state.view==='proyecto' && !getProyecto()) state.view='proyectos';
  if(state.view==='mockup' && !getProyecto()) state.view='proyectos';
  if(state.view==='gira' && !giraById(state.giraId)) state.view='giras';
  if(state.view==='venue' && !venueById(state.venueId)) state.view='venues';
  if(state.view==='plan' && !planById(state.planId)) state.view='planes';
  if(state.view==='proveedor' && !proveedorRosterById(state.proveedorRosterId)) state.view='proveedores';
  ({home:viewHome, proyectos:viewProyectos, proyecto:viewProyecto, roster:viewRoster, sincronizar:viewSync, emparejar:viewMatch, config:viewConfig, respaldo:viewRespaldo, giras:viewGiras, gira:viewGiraDetalle, venues:viewVenues, venue:viewVenueDetalle, planes:viewPlanes, plan:viewPlanDetalle, proveedores:viewProveedoresRoster, proveedor:viewProveedorRosterDetalle, mockup:viewMockup}[state.view] || viewHome)(m);
  if(state.view==='sincronizar') bindSyncDropzone();
}

function abrirProveedorRoster(id){ state.proveedorRosterId=id; state.view='proveedor'; render(); window.scrollTo(0,0); }

  const arr = state.proveedoresRoster.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  m.innerHTML = `<div class="dash-head"><div><h1 class="page-title">Proveedores</h1><div class="page-sub">Empresas externas y lo que pueden prestar — audio, iluminación, pantallas... Vincula gente del Roster a una de estas para saber qué puesto puede cubrir.</div></div>
      <div class="top-actions"><button class="btn btn-solid" onclick="crearProveedorRoster()">+ Nuevo proveedor</button></div></div>
    ${!arr.length ? '<div class="empty-state"><h2>Aún no hay proveedores</h2><p>Crea el primero — por ejemplo, una empresa de audio o de estructuras.</p></div>' :
      `<div class="event-grid">${arr.map(pv=>`<div class="event-card" onclick="abrirProveedorRoster('${pv.id}')"><h3>${esc(pv.nombre||'Sin nombre')}</h3>
        <div class="event-meta">${pv.servicios.length?pv.servicios.map(esc).join(' · '):'Sin servicios capturados'}</div></div>`).join('')}</div>`}`;
}
function crearProveedorRoster(){
  pedirTexto('Nombre de la empresa', nombre=>{
    const pv=nuevoProveedorRoster({nombre}); commitPv(()=>{ state.proveedoresRoster.push(pv); });
    abrirProveedorRoster(pv.id);
  }, '', 'Ej. DREA');
}
function viewProveedorRosterDetalle(m){
  const pv=proveedorRosterById(state.proveedorRosterId); if(!pv) return;
  const f=(k,l,w)=>`<div class="form-group"><label>${l}</label><input style="min-width:${w||170}px" value="${esc(pv[k])}" onchange="setProveedorRostercampo('${pv.id}','${k}',this.value)" autocomplete="off"></div>`;
  const usoCount = state.roster.filter(x=>x.proveedorId===pv.id).length;
  m.innerHTML = `<div class="dash-head"><div><button class="btn btn-ghost btn-sm" onclick="ir('proveedores')">← Proveedores</button></div></div>
    <div class="card"><h3 class="subsection-title" style="margin-top:0">Ficha del proveedor</h3>
      <div class="row">${f('nombre','Nombre de la empresa',260)}${f('contacto','Contacto',200)}${f('telefono','Teléfono',150)}${f('email','Email',220)}</div>
      <h4 class="mini-title">Servicios que puede cubrir</h4>
      <p class="hint">Cada servicio que agregues aquí aparecerá como opción de puesto cuando des de alta a alguien de esta empresa en el Roster.</p>
      <div class="chips-edit">${pv.servicios.map((s,i)=>`<span class="chip-tag">${esc(s)} <button onclick="quitarServicioProveedor('${pv.id}',${i})">×</button></span>`).join('')}</div>
      <button class="btn btn-ghost btn-sm" onclick="agregarServicioProveedor('${pv.id}')">+ Agregar servicio del catálogo de áreas</button>
      <p class="hint">${usoCount?`${usoCount} persona(s) del Roster vinculada(s) a esta empresa.`:'Todavía no hay nadie del Roster vinculado a esta empresa.'}</p>
      <button class="btn btn-ghost btn-sm" style="color:#E4372B;border-color:#E4372B" onclick="eliminarProveedorRoster('${pv.id}')">Eliminar proveedor</button></div>`;
}
function setProveedorRostercampo(id,campo,val){ const pv=proveedorRosterById(id); if(!pv) return; commitPv(()=>{ pv[campo]=val; }); }
function agregarServicioProveedor(id){
  const pv=proveedorRosterById(id); if(!pv) return;
  const opciones=[];
  C().areas.forEach(a=>{
    if(a.especial){ opciones.push({id:a.nombre, label:a.nombre}); return; }
    (a.rubros&&a.rubros.length?a.rubros:[null]).forEach(r=>{
      const label = r ? `${a.nombre} — ${r}` : a.nombre;
      opciones.push({id:label, label});
    });
  });
  const disponibles = opciones.filter(o=>!pv.servicios.some(s=>norm(s)===norm(o.id)));
  pedirSeleccion('Elige un servicio del catálogo de áreas', disponibles, (val)=>{
    commitPv(()=>{ pv.servicios.push(val); });
  });
}
function quitarServicioProveedor(id,i){ const pv=proveedorRosterById(id); if(!pv) return; commitPv(()=>{ pv.servicios.splice(i,1); }); }
function eliminarProveedorRoster(id){
  const usoCount = state.roster.filter(x=>x.proveedorId===id).length;
  pedirConfirmacion(`¿Eliminar este proveedor?${usoCount?` ${usoCount} persona(s) del Roster se desvincularán (conservan su puesto actual como texto).`:''}`, ()=>{
    commitPv(()=>{ state.proveedoresRoster=state.proveedoresRoster.filter(x=>x.id!==id); });
    state.roster.filter(x=>x.proveedorId===id).forEach(x=>{ x.proveedorId=null; });
    persistPersonas();
    ir('proveedores');
  }, 'Eliminar');
}

    <div><b>${esc(p.eventoId||'Sin ID')}</b> <span class="pill ${c.pct>=60?'zero':'bad'}">${c.pct}%</span></div>
    <div class="muted small">Falta: ${c.faltantes.map(esc).join(', ')}</div></div>`;
  const filaConflicto = ({personaId,a,b})=>`<div class="home-row">
    <div><b>${esc(nombrePersona(personaId)||'Sin nombre')}</b></div>
    <div class="muted small">
      <a href="#" onclick="abrirProyecto('${a.proyecto.id}');return false" style="color:var(--accent-text)">${esc(a.proyecto.eventoId||'Sin ID')}</a> (${esc((areaByIdProy(a.proyecto,a.areaId)||{}).nombre||'')}, ${fmtFechaCorta(a.rango.ini)}–${fmtFechaCorta(a.rango.fin)})

    </div></div>`;

      <div class="total-box"><div class="label">Eventos en 30 días</div><div class="value">${en30}</div></div>
      <div class="total-box${conflictos.length?' kpi-alerta':''}"><div class="label">Conflictos</div><div class="value">${conflictos.length}</div></div>
      <div class="total-box${sinCurp?' kpi-alerta':''}"><div class="label">Personas sin CURP</div><div class="value">${sinCurp}</div></div>
    </div>
    <div class="dash-two">

// ---- Importar venues desde un respaldo tipo "solo-venues" (u otro con forma de lista/objeto de venues).
// Las fotos y puntos de acceso con foto no se importan por ahora — solo el texto.
function importarVenueDesdeJSON(v){
  const transito = [v.transitoHorario, v.transitoNotas].filter(x=>x&&x.trim()).join(' — ');
  return nuevoVenue({
    nombre: v.name||v.nombre||'', direccion: v.address||v.direccion||'', ciudad: v.ciudad||'',
    estado: v.estado||'', pais: (v.pais==='Otro'?v.paisOtro:v.pais)||v.pais||'',
    coordenadas: v.coordenadas||'', capacidad: v.capacidad||'',
    tipoRecinto: v.tipo||v.tipoRecinto||'', tipoSuperficie: (v.superficie==='Otro'?v.superficieOtro:v.superficie)||v.tipoSuperficie||'',
    mapsUrl: v.mapsUrl||'', contactoNombre: v.contactoNombre||'', contactoTel: v.contactoTel||'', contactoEmail: v.contactoEmail||'',
    hospitalCercano: v.hospitalCercano||'', restriccionesTransito: transito||v.restriccionesTransito||'', descripcion: v.notas||v.descripcion||'',
  });
}
function importarVenuesJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ if(!inp.files[0]) return; const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      let lista=[];
      if(d.venues && typeof d.venues==='object' && !Array.isArray(d.venues)) lista=Object.values(d.venues);
      else if(Array.isArray(d.venues)) lista=d.venues;
      else if(Array.isArray(d)) lista=d;
      if(!lista.length){ toast('No se encontraron venues en ese archivo'); return; }
      pedirConfirmacion(`¿Importar ${lista.length} venue(s)? Los que ya existan con el mismo nombre no se duplican. Las fotos no se importan.`, ()=>{
        const existentes = new Set(state.venues.map(v=>norm(v.nombre)));
        let nuevos=0;
        lista.forEach(v=>{
          const nombre=v.name||v.nombre||''; if(!nombre || existentes.has(norm(nombre))) return;
          state.venues.push(importarVenueDesdeJSON(v)); nuevos++;
        });
        persistVenues(); render();
        toast(`${nuevos} venue(s) importado(s)${nuevos<lista.length?`, ${lista.length-nuevos} ya existían o sin nombre`:''}.`);
      }, 'Importar');
    }catch(e){ toast('No se pudo leer el archivo: '+(e.message||'')); } };
    r.readAsText(inp.files[0]);
  };
  inp.click();
}

function proyectosFiltrados(){
  const q=norm(state.busqueda);
  return state.proyectos.filter(p=>(state.filtroEstado==='todos'||p.estado===state.filtroEstado) && (!q||norm([p.eventoId,p.artista,p.cliente,p.ciudad].join(' ')).includes(q)))

  const box=document.getElementById('lista'); if(!box) return;

function ajustarScrollGantt(box){
  // Abre el Gantt mostrando el proyecto más próximo, no el borde izquierdo arbitrario del rango —
  // en móvil, si el evento más cercano está a varias semanas de hoy, de otro modo se ve vacío.
  const scroller = box.querySelector('.gantt-scroll'); if(!scroller) return;
  const chips = box.querySelectorAll('.gantt-chip'); if(!chips.length) return;
  let minLeft = Infinity;
  chips.forEach(c=>{ const left=parseFloat(c.style.left)||0; if(left<minLeft) minLeft=left; });
  if(minLeft===Infinity) return;
  scroller.scrollLeft = Math.max(0, minLeft-60);
}

function duplicarProyecto(id){

  copia.giraId=null;

/* ---------------- Vista Gantt de Mis Proyectos ---------------- */
function ganttProyectos(arr){
  const dated = arr.map(p=>({p, r:rangoDeProyecto(p)})).filter(x=>x.r);
  if(!dated.length) return '<div class="empty-state"><h2>Sin fechas capturadas</h2><p>Ningún proyecto visible tiene fechas todavía — la vista Gantt necesita al menos una por proyecto.</p></div>';
  const PXDAY=28;
  const parseD = s=>new Date(s+'T00:00:00');
  const today=new Date(); today.setHours(0,0,0,0);
  let minDate = dated.reduce((m,x)=>parseD(x.r.ini)<m?parseD(x.r.ini):m, parseD(dated[0].r.ini));
  let maxDate = dated.reduce((m,x)=>parseD(x.r.fin)>m?parseD(x.r.fin):m, parseD(dated[0].r.fin));
  if(today<minDate) minDate=new Date(today); if(today>maxDate) maxDate=new Date(today);
  minDate.setDate(minDate.getDate()-3); maxDate.setDate(maxDate.getDate()+3);
  const totalDays = Math.round((maxDate-minDate)/86400000)+1;
  const totalWidth = totalDays*PXDAY;
  let months=[]; let cursor=new Date(minDate.getFullYear(),minDate.getMonth(),1);
  while(cursor<=maxDate){
    const segStart = cursor<minDate?minDate:cursor;
    const nextMonth = new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
    const segEnd = nextMonth<maxDate?nextMonth:new Date(maxDate.getTime()+86400000);
    const left=Math.round((segStart-minDate)/86400000)*PXDAY;
    const width=Math.round((segEnd-segStart)/86400000)*PXDAY;
    months.push({label:cursor.toLocaleDateString('es-MX',{month:'long',year:'numeric'}), left, width});
    cursor=nextMonth;
  }
  const todayLeft=Math.round((today-minDate)/86400000)*PXDAY;
  const colorEstado = k => ({prospecto:'var(--surf-4)',confirmado:'var(--border-strong)',en_progreso:'var(--lime)',cerrado:'var(--steelgray)',cancelado:'var(--warn)'}[k]||'var(--surf-4)');
  const rows = dated.map(({p,r})=>{
    const start=parseD(r.ini), end=parseD(r.fin);
    const left=Math.round((start-minDate)/86400000)*PXDAY;
    const width=Math.max(PXDAY,(Math.round((end-start)/86400000)+1)*PXDAY);
    return `<div class="gantt-row"><div class="gantt-row-label" onclick="abrirProyecto('${p.id}')" title="${esc(p.eventoId||'Sin ID')}">${esc(p.eventoId||'Sin ID')}</div>
      <div class="gantt-row-track" style="width:${totalWidth}px"><div class="gantt-chip" onclick="abrirProyecto('${p.id}')" style="left:${left}px;width:${width}px;background:${colorEstado(p.estado)}"><span>${esc(p.eventoId||'Sin ID')}</span></div></div></div>`;
  }).join('');
  const sinFecha = arr.length-dated.length;
  return `<div class="gantt-wrap"><div class="gantt-scroll">
    <div class="gantt-header" style="width:${totalWidth+180}px"><div class="gantt-header-spacer"></div><div class="gantt-header-track" style="width:${totalWidth}px">${months.map(mo=>`<div class="gantt-month" style="left:${mo.left}px;width:${mo.width}px">${esc(mo.label)}</div>`).join('')}</div></div>
    <div class="gantt-body" style="width:${totalWidth+180}px">${rows}<div class="gantt-today-line" style="left:${todayLeft+180}px" title="Hoy"></div></div>
  </div>${sinFecha?`<p class="muted small" style="margin-top:8px">${sinFecha} proyecto${sinFecha===1?'':'s'} sin fecha no se muestra${sinFecha===1?'':'n'} aquí.</p>`:''}</div>`;
}
/* ---------------- Vista Calendario de Mis Proyectos ---------------- */
function calendarioProyectos(arr){
  const base = state.calMes || new Date().toISOString().slice(0,7);
  const [y,mo] = base.split('-').map(Number);
  const primerDia = new Date(y,mo-1,1); const ultimoDia = new Date(y,mo,0);
  const dias=[]; for(let i=0;i<primerDia.getDay();i++) dias.push(null);
  for(let d=1;d<=ultimoDia.getDate();d++) dias.push(new Date(y,mo-1,d));
  const porDia = {};
  arr.forEach(p=>{ const r=rangoDeProyecto(p); if(!r) return;
    diasDeRango(r.ini,r.fin).forEach(iso=>{ if(!porDia[iso]) porDia[iso]=[]; porDia[iso].push(p); }); });
  const nombreMes = primerDia.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const celdas = dias.map(d=>{
    if(!d) return '<div class="cal-cell cal-cell-empty"></div>';
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const ps = porDia[iso]||[];
    return `<div class="cal-cell"><div class="cal-cell-num">${d.getDate()}</div>${ps.slice(0,3).map(p=>`<div class="cal-cell-chip" onclick="abrirProyecto('${p.id}')" title="${esc(p.eventoId||'Sin ID')}">${esc(p.eventoId||'Sin ID')}</div>`).join('')}${ps.length>3?`<div class="muted small">+${ps.length-3} más</div>`:''}</div>`;
  }).join('');
  return `<div class="card"><div class="row cal-nav" style="justify-content:space-between;align-items:center;flex-wrap:nowrap">
      <button class="btn btn-ghost btn-sm" onclick="moverMesCalendario(-1)"><span class="txt-full">← Anterior</span><span class="txt-short">‹</span></button>
      <h3 style="margin:0;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1;min-width:0">${esc(nombreMes)}</h3>
      <button class="btn btn-ghost btn-sm" onclick="moverMesCalendario(1)"><span class="txt-full">Siguiente →</span><span class="txt-short">›</span></button></div>
    <div class="cal-grid-head">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${celdas}</div></div>`;
}
function moverMesCalendario(delta){
  const base = state.calMes || new Date().toISOString().slice(0,7);
  const [y,mo]=base.split('-').map(Number);
  const d=new Date(y,mo-1+delta,1);
  state.calMes = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  pintaLista();
}

function aplicarSlotsPuestoProyector(areaK,puestoId,val){
  const p=getProyecto(); const objetivo=Math.max(0, parseInt(val)||0);
  const actuales=p.proyector.crew.filter(c=>c.area===areaK && c.puestoId===puestoId);
  commit(()=>{
    if(objetivo>actuales.length){ for(let i=actuales.length;i<objetivo;i++) p.proyector.crew.push(nuevoCrewProyector(areaK,puestoId)); }
    else if(objetivo<actuales.length){
      const aQuitar=actuales.slice(objetivo).map(c=>c.id);
      p.proyector.crew=p.proyector.crew.filter(c=>!aQuitar.includes(c.id));
    }
  });
}

// ---- Dashboard de eficiencia: cuánto del presupuesto de cada área ya se usó, y qué rubros
// tienen la mayor variación (buena o mala) — para ver de un vistazo dónde poner atención.
function datosEficienciaTracker(p){
  const facts = factsDeTrk(p);
  const porArea = new Map();
  facts.forEach(f=>{ const ak=f.area||'__sin'; if(!porArea.has(ak)) porArea.set(ak,{pres:0,real:0}); const o=porArea.get(ak); o.pres+=f.pres; o.real+=f.real; });
  const areas = Array.from(porArea.entries()).map(([ak,v])=>({nombre: ak==='__sin'?'Sin área':((areaByIdProy(p,ak)||{}).nombre||'Área eliminada'), ...v})).sort((a,b)=>b.pres-a.pres);
  const porRubro = new Map();
  facts.forEach(f=>{ const rk=f.rubro||'__sin'; if(!porRubro.has(rk)) porRubro.set(rk,{pres:0,real:0}); const o=porRubro.get(rk); o.pres+=f.pres; o.real+=f.real; });
  const variaciones = Array.from(porRubro.entries()).map(([rk,v])=>({rubro:rk==='__sin'?'Sin clasificar':rubroNombreTrk(rk), dif:v.pres-v.real, pres:v.pres, real:v.real}))
    .filter(v=>v.pres>0||v.real>0).sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif)).slice(0,5);
  return {areas, variaciones};
}
function dashboardEficienciaTracker(p){
  const {areas, variaciones} = datosEficienciaTracker(p);
  const barras = areas.map(f=>{
    const pctRaw = f.pres>0 ? (f.real/f.pres*100) : (f.real>0?999:0);
    const pct = Math.min(100, pctRaw); const over = pctRaw>100;
    return `<div class="dash-bar-row"><div class="dash-bar-label">${esc(f.nombre)}</div>
      <div class="dash-bar-track"><div class="dash-bar-fill${over?' over':''}" style="width:${pct}%"></div></div>
      <div class="dash-bar-val">${fmtMXN(f.real)} / ${fmtMXN(f.pres)} (${pctRaw.toFixed(0)}%)</div></div>`;
  }).join('');
  return `<div class="card"><h3 class="subsection-title" style="margin-top:0">Dashboard de eficiencia</h3>
    <p class="hint">Qué tanto del presupuesto de cada área ya se gastó. La barra se pone ámbar si ya se pasó del 100%.</p>
    <div class="dash-bars">${barras || '<p class="muted small">Sin datos capturados todavía.</p>'}</div>

    <table class="app-table"><thead><tr><th>Rubro</th><th class="num">Presupuesto</th><th class="num">Real</th><th class="num">Diferencia</th></tr></thead><tbody>
    ${variaciones.map(v=>`<tr><td>${esc(v.rubro)}</td><td class="num">${fmtMXN(v.pres)}</td><td class="num">${fmtMXN(v.real)}</td><td class="num ${difClsTrk(v.dif)}">${fmtMXN(v.dif)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted" style="padding:12px;text-align:center">Sin variaciones que mostrar.</td></tr>'}
    </tbody></table></div>`;
}
function seccionResumenTrk(p,t){
  const provs=new Map();
  factsDeTrk(p).forEach(f=>{
    const pk=f.rubro?(provDeRubroTrk(f.rubro)||'__sinprov'):'__sin'; const rk=f.rubro||'__sin', ak=f.area||'__sin';
    const get=(mp,k)=>{ let o=mp.get(k); if(!o){ o={pres:0,real:0,h:new Map()}; mp.set(k,o); } return o; };
    const a=get(provs,pk), b=get(a.h,rk), c=get(b.h,ak);
    [a,b,c].forEach(o=>{ o.pres+=f.pres; o.real+=f.real; });
  });
  let rows='';
  Array.from(provs.entries()).forEach(([pk,pv])=>{
    rows+=`<tr class="subtotal"><td>${esc(pk==='__sin'?'Sin clasificar':(provByIdTrk(pk)||{}).nombre||'Sin proveedor')}</td><td class="num">${fmt0(pv.pres)}</td><td class="num">${fmt0(pv.real)}</td><td class="num ${difClsTrk(pv.pres-pv.real)}">${fmt0(pv.pres-pv.real)}</td><td class="num">${pillEfTrk(pv.pres>0?(pv.pres-pv.real)/pv.pres:null)}</td></tr>`;
    Array.from(pv.h.entries()).forEach(([rk,rv])=>{
      rows+=`<tr class="rub"><td>${esc(rubroNombreTrk(rk==='__sin'?null:rk))}</td><td class="num">${fmt0(rv.pres)}</td><td class="num">${fmt0(rv.real)}</td><td class="num ${difClsTrk(rv.pres-rv.real)}">${fmt0(rv.pres-rv.real)}</td><td class="num">${pillEfTrk(rv.pres>0?(rv.pres-rv.real)/rv.pres:null)}</td></tr>`;
    });
  });
  if(!rows) rows='<tr><td colspan="5" class="muted" style="padding:16px;text-align:center">Aún no hay presupuesto ni gasto capturado.</td></tr>';
  return `<div class="card"><h3 class="subsection-title" style="margin-top:0">Desglose por proveedor interno → rubro</h3>
    <div class="table-wrap"><table class="app-table"><thead><tr><th>Proveedor / rubro</th><th class="num">Presupuesto</th><th class="num">Real</th><th class="num">Diferencia</th><th class="num">Eficiencia</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

}

function setMovTrk(id,campo,val){ const p=getProyecto(); const m=p.tracker.movimientos.find(x=>x.id===id); if(!m) return; commit(()=>{ m[campo]= campo==='monto'?num(val):(val||null); }); }

function setFechaGlobal(campo,val){ const p=getProyecto(); commit(()=>{ p.fechas[campo]=val; }); }
function toggleOverride(k,on){ const p=getProyecto(); commit(()=>{ p.fechasPorArea[k]= on ? Object.assign({},p.fechas) : null; }); }
function setFechaArea(k,campo,val){ const p=getProyecto(); commit(()=>{ p.fechasPorArea[k][campo]=val; }); }
function setTipoDiaGlobal(iso,val){ const p=getProyecto(); commit(()=>{ if(val===tipoAutoDia(p.fechas,iso)) delete p.fechas.tiposPorDia[iso]; else p.fechas.tiposPorDia[iso]=val; }); }
function setTipoDiaArea(k,iso,val){ const p=getProyecto(); commit(()=>{ const f=p.fechasPorArea[k]; if(!f) return; if(val===tipoAutoDia(f,iso)) delete f.tiposPorDia[iso]; else f.tiposPorDia[iso]=val; }); }
function setTurnoGlobal(iso,val){ const p=getProyecto(); commit(()=>{ if(val==='doble') delete p.fechas.turnosPorDia[iso]; else p.fechas.turnosPorDia[iso]=val; }); }
function setTurnoArea(k,iso,val){ const p=getProyecto(); commit(()=>{ const f=p.fechasPorArea[k]; if(!f) return; if(val==='doble') delete f.turnosPorDia[iso]; else f.turnosPorDia[iso]=val; }); }
function setViajeGlobal(iso,campo,val){ const p=getProyecto(); commit(()=>{ if(!p.fechas.viajesPorDia) p.fechas.viajesPorDia={}; if(!p.fechas.viajesPorDia[iso]) p.fechas.viajesPorDia[iso]=viajeDe(p.fechas,iso); p.fechas.viajesPorDia[iso][campo]=val; }); }
function setViajeArea(k,iso,campo,val){ const p=getProyecto(); commit(()=>{ const f=p.fechasPorArea[k]; if(!f) return; if(!f.viajesPorDia) f.viajesPorDia={}; if(!f.viajesPorDia[iso]) f.viajesPorDia[iso]=viajeDe(f,iso); f.viajesPorDia[iso][campo]=val; }); }
function setHotelGlobal(campo,val){ const p=getProyecto(); commit(()=>{ if(!p.fechas.hotel) p.fechas.hotel=hotelDe(p.fechas); p.fechas.hotel[campo]=val; }); }
function setHotelArea(k,campo,val){ const p=getProyecto(); commit(()=>{ const f=p.fechasPorArea[k]; if(!f) return; if(!f.hotel) f.hotel=hotelDe(f); f.hotel[campo]=val; }); }
function panelViaje(f, iso, setterViaje){
  const v = viajeDe(f, iso);
