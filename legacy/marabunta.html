      <input placeholder="${v.tipo==='vuelo'?'Aerolínea':'Línea (ETN, Primera Plus…)'}" value="${esc(v.linea)}" onchange="${setterViaje}('${iso}','linea',this.value)" autocomplete="off">
      <input placeholder="${v.tipo==='vuelo'?'N° de vuelo':'N° de corrida'}" value="${esc(v.numero)}" onchange="${setterViaje}('${iso}','numero',this.value)" autocomplete="off">
      <input type="time" value="${esc(v.salida)}" onchange="${setterViaje}('${iso}','salida',this.value)" autocomplete="off">
      <input placeholder="${v.tipo==='vuelo'?'Origen':'Terminal origen'}" value="${esc(v.origen)}" onchange="${setterViaje}('${iso}','origen',this.value)" autocomplete="off">
      <input placeholder="${v.tipo==='vuelo'?'Destino':'Terminal destino'}" value="${esc(v.destino)}" onchange="${setterViaje}('${iso}','destino',this.value)" autocomplete="off">` : '';
  return `<div class="viaje-mini">
    <select onchange="${setterViaje}('${iso}','tipo',this.value)">
      <option value="">Transporte…</option>
      <option value="vuelo"${v.tipo==='vuelo'?' selected':''}>Vuelo</option>
      <option value="autobus"${v.tipo==='autobus'?' selected':''}>Autobús de línea</option>
      <option value="otro"${v.tipo==='otro'?' selected':''}>Otro</option>
    </select>${campos}
    ${v.tipo?`<input placeholder="Link de rastreo (opcional)" value="${esc(v.link)}" onchange="${setterViaje}('${iso}','link',this.value)" autocomplete="off">`:''}
  </div>`;
}

    </div></div>`;

function previewCalendario(f, setterTipo, setterTurno, setterViaje){
  if(!f.llegada || !f.loadOut) return '<p class="muted small">Captura llegada y salida para ver el calendario.</p>';
  const dias=diasDeRango(f.llegada,f.loadOut);
  return `<div class="cal-preview">${dias.map(iso=>{ const t=tipoDia(f,iso); const tu=turnoDia(f,iso); return `<div class="cal-day cal-${norm(t)}">
      <div class="cal-fecha">${fmtFechaCorta(iso)}</div>
      <select class="cal-tipo-sel" onchange="${setterTipo}('${iso}',this.value)">${listaTiposDia().map(x=>`<option value="${x}"${x===t?' selected':''}>${x}</option>`).join('')}</select>
      ${setterTurno?`<select class="cal-tipo-sel" title="Turno de este día en el Planner (Ruta Crítica, Catering, Mano de Obra, CARGO)" onchange="${setterTurno}('${iso}',this.value)"><option value="doble"${tu==='doble'?' selected':''}>Día y noche</option><option value="unico"${tu==='unico'?' selected':''}>Turno único</option></select>`:''}
      ${setterViaje && esDiaDeViaje(f,iso) ? panelViaje(f,iso,setterViaje) : ''}
    </div>`; }).join('')}</div>
  <p class="hint" style="margin-top:6px">Cada día trae un tipo sugerido según llegada, showday y salida; cámbialo aquí si el proyecto tiene más de un día de Show o un montaje distinto. El turno decide si ese día se captura en una sola columna o en Día y Noche en el Planner. Los días de Previo y Salida son los días de viaje del crew — ahí puedes capturar el transporte.</p>`;
}
function secAreasFechas(p){
  const fFechas=(obj,setter,w)=>`<div class="row">
      <div class="form-group"><label>Llegada (Previo)</label><input type="date" data-k="${setter}:llegada" style="min-width:${w||150}px" value="${esc(obj.llegada)}" onchange="${setter}('llegada',this.value)" autocomplete="off"></div>
      <div class="form-group"><label>Showday</label><input type="date" data-k="${setter}:showday" style="min-width:${w||150}px" value="${esc(obj.showday)}" onchange="${setter}('showday',this.value)" autocomplete="off"></div>
      <div class="form-group"><label>Salida (loadOut)</label><input type="date" data-k="${setter}:loadOut" style="min-width:${w||150}px" value="${esc(obj.loadOut)}" onchange="${setter}('loadOut',this.value)" autocomplete="off"></div></div>`;
  return `<div class="card"><h3 class="subsection-title" style="margin-top:0">Áreas y calendario</h3>
    <p class="hint">Cada área es tuya para nombrarla como quieras — así este mismo Brief te sirve para un evento estructural, una gira, o cualquier otra cosa.</p>
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">${p.areas.map(a=>`<div class="form-group"><label>&nbsp;</label><div style="display:flex;gap:4px;align-items:center"><input data-k="areanom:${a.id}" style="min-width:140px" value="${esc(a.nombre)}" onchange="renombrarArea('${a.id}',this.value)" autocomplete="off"><button class="btn-icon-del" title="Quitar área" onclick="quitarArea('${a.id}')">×</button></div></div>`).join('')}</div>
    <h4 class="mini-title">Fechas del proyecto (aplican a toda área que no tenga fecha propia)</h4>
    ${fFechas(p.fechas,'setFechaGlobal')}
    ${previewCalendario(p.fechas,'setTipoDiaGlobal','setTurnoGlobal','setViajeGlobal')}
    ${panelHotel(p.fechas,'setHotelGlobal')}
    <div class="row" style="margin:14px 0;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="agregarAreaGenerica()">+ Agregar área…</button>
    </div>
    ${p.areas.map(a=>{
      const ov=p.fechasPorArea[a.id];
      return `<h4 class="mini-title">${esc(a.nombre)} <label class="chk-area" style="font-weight:400;text-transform:none;margin-left:10px"><input type="checkbox" ${ov?'checked':''} onchange="toggleOverride('${a.id}',this.checked)" autocomplete="off"> fechas propias</label></h4>
        ${ov ? fFechas(ov, `(c,v)=>setFechaArea('${a.id}',c,v)`) + previewCalendario(ov, `(iso,v)=>setTipoDiaArea('${a.id}',iso,v)`, `(iso,v)=>setTurnoArea('${a.id}',iso,v)`, `(iso,c,v)=>setViajeArea('${a.id}',iso,c,v)`) + panelHotel(ov, `(c,v)=>setHotelArea('${a.id}',c,v)`) : '<p class="muted small">Usa las fechas del proyecto.</p>'}`;
    }).join('')}
    <p class="hint">Disponibilidad = desde el Previo (llegada) hasta la Salida de cada área, sin importar los días intermedios.</p></div>`;
}
function renombrarArea(id,nombre){ const p=getProyecto(); commit(()=>{ const a=areaByIdProy(p,id); if(a) a.nombre=nombre; }); }
function agregarAreaEspecial(id,nombre,tipo){ const p=getProyecto(); if(p.areas.some(a=>a.id===id)) return; commit(()=>{ p.areas.push(nuevaAreaProyecto(nombre,tipo,id)); }); }
function agregarAreaGenerica(){
  const p=getProyecto();
  const yaAgregadas = new Set(p.areas.map(a=>a.id));
  const disponibles = C().areas.filter(a=>!yaAgregadas.has(a.id));
  const opciones = disponibles.map(a=>({id:a.id, label:a.nombre+(a.especial?' (especial)':(a.rubros&&a.rubros.length?` (${a.rubros.length} rubro${a.rubros.length===1?'':'s'})`:''))}));
  opciones.push({id:'__config__', label:'+ Agregar una nueva área en Configuración…'});
  pedirSeleccion('Elige un área del catálogo', opciones, (areaId)=>{
    if(areaId==='__config__'){ ir('config'); return; }
    const catArea = areaById(areaId); if(!catArea) return;
    const area = nuevaAreaProyecto(catArea.nombre, catArea.especial||'generico', catArea.id);
    commit(()=>{
      p.areas.push(area);
      if(!catArea.especial && catArea.rubros && catArea.rubros.length) p.reqGenericoGrupos[area.id]=catArea.rubros.map(n=>nuevoSubgrupoReq(n));
    });
  });
}
function quitarArea(id){
  const p=getProyecto();
  pedirConfirmacion('¿Quitar esta área del proyecto? Se pierden sus fechas propias, su responsable y sus requerimientos capturados.', ()=>{
    commit(()=>{
      p.areas=p.areas.filter(a=>a.id!==id);
      delete p.fechasPorArea[id]; delete p.responsablesPorArea[id]; delete p.reqGenerico[id];
      if(id==='steel'){ p.reqSteel=[]; p.reqDelay=[]; }
      if(id==='eps'){ p.reqPanel=[]; p.reqBarricada={}; p.reqCable=[]; }
      if(p.proyector) p.proyector.crew=p.proyector.crew.filter(c=>c.area!==id);
    });
  }, 'Quitar');
}

/* --- Responsables + disponibilidad --- */
function optsPersona(cands, sel){
  return '<option value="">Sin asignar</option>'+cands.map(c=>{
    const marca = c.libre ? '' : ` ⚠ choca con ${c.choques.map(x=>x.proyecto.eventoId).join(', ')}`;
    const prov = nombrePersonaProveedor(c.persona.id);
    return `<option value="${c.persona.id}"${c.persona.id===sel?' selected':''}>${esc(c.persona.nombre)}${prov?' — '+esc(prov):''}${marca}</option>`;
  }).join('');
}
function filaResponsable(p, area){
  const r=p.responsablesPorArea[area.id]||{personaId:null,puesto:'',conflicto:null};
  const cands=candidatosConDisponibilidad(p, area.id, r.personaId);
  const persona = r.personaId ? state.roster.find(x=>x.id===r.personaId) : null;
  const empresa = persona ? nombrePersonaProveedor(persona.id) : '';
  const ficha = persona ? `<div class="resp-ficha">${empresa?`<span><b>Empresa:</b> ${esc(empresa)}</span>`:'<span class="muted">Directo / interno</span>'}${persona.puesto?`<span><b>Puesto:</b> ${esc(persona.puesto)}</span>`:''}${persona.telefono?`<span><b>Tel:</b> ${esc(persona.telefono)}</span>`:'<span class="muted">Sin teléfono capturado</span>'}</div>` : '';
  return `<div class="form-group"><label>${esc(area.nombre)}</label>
    <select data-k="resp:${area.id}" onchange="setResponsablePersona('${area.id}',this.value)">${optsPersona(cands,r.personaId)}</select>
    ${!cands.length?`<p class="hint" style="margin:4px 0">Nadie en el Roster tiene el área "${esc(area.nombre)}" capturada todavía.</p>`:''}
    <input data-k="resppuesto:${area.id}" style="margin-top:4px" placeholder="Título del responsable (ej. Jefe de Steel)" value="${esc(r.puesto)}" onchange="setResponsablePuesto('${area.id}',this.value)" autocomplete="off">
    ${ficha}
    ${r.conflicto?`<div class="warning-box" style="margin-top:6px;padding:8px 12px;font-size:12px">${esc(r.conflicto.plantilla)}${r.conflicto.manual?'<br>'+esc(r.conflicto.manual):''}</div>`:''}</div>`;
}
function secResponsables(p){
  if(!p.areas.length) return `<div class="card"><h3 class="subsection-title" style="margin-top:0">Responsables</h3><p class="muted">Agrega un área en "Áreas y calendario" para poder asignarle un responsable.</p></div>`;
  if(!state.roster.length) return `<div class="card"><h3 class="subsection-title" style="margin-top:0">Responsables</h3><p class="muted">Agrega personas en la pestaña Roster para poder asignar responsables.</p></div>`;
  return `<div class="card"><h3 class="subsection-title" style="margin-top:0">Responsables</h3>
    <div class="row">${p.areas.map(a=>filaResponsable(p,a)).join('')}</div>
    <p class="hint">Los nombres marcados con ⚠ ya están asignados en otro proyecto en fechas que se encimen con las de este.</p></div>`;
}
function setResponsablePuesto(areaId,val){ const p=getProyecto(); commit(()=>{ if(!p.responsablesPorArea[areaId]) p.responsablesPorArea[areaId]={personaId:null,puesto:'',conflicto:null}; p.responsablesPorArea[areaId].puesto=val; }); }
function setResponsablePersona(areaId,personaId){
  const p=getProyecto();
  if(!p.responsablesPorArea[areaId]) p.responsablesPorArea[areaId]={personaId:null,puesto:'',conflicto:null};
  if(!personaId){ commit(()=>{ p.responsablesPorArea[areaId].personaId=null; p.responsablesPorArea[areaId].conflicto=null; }); return; }
  const rango = rangoDeArea(p,areaId);
  if(!rango){ toast('Captura primero las fechas de esta área'); render(); return; }
  const choques = choquesDe(personaId, rango, p.id);
  if(!choques.length){ commit(()=>{ p.responsablesPorArea[areaId].personaId=personaId; p.responsablesPorArea[areaId].conflicto=null; }); return; }
  state.conflicto = {areaId, personaId, rango, choque:choques[0]};
  render();
}
function secConflicto(p){
  const c=state.conflicto; const persona=state.roster.find(x=>x.id===c.personaId);
  const otro=c.choque.proyecto; const areaAqui=areaByIdProy(p,c.areaId);
  const plantilla = c.choque.rango.fin <= c.rango.ini
    ? `Solicitado para ${p.eventoId} mientras cerraba ${otro.eventoId}`
    : `Solicitado para ${otro.eventoId} mientras cerraba ${p.eventoId}`;
  return `<div class="card conflicto"><h3 class="subsection-title" style="margin-top:0">Choque de agenda</h3>
    <p class="hint"><strong>${esc(persona.nombre)}</strong> ya está asignado en <strong>${esc(otro.eventoId)}</strong> (${esc(otro.artista)}) del ${fmtFecha(c.choque.rango.ini)} al ${fmtFecha(c.choque.rango.fin)}. ${esc(areaAqui?areaAqui.nombre:'Esta área')} lo necesita del ${fmtFecha(c.rango.ini)} al ${fmtFecha(c.rango.fin)}.</p>
    <div class="dash-two">
      <div class="card"><h4 class="mini-title">Opción 1 · Ajustar el otro proyecto</h4>
        <p class="hint">Si en realidad va a salir antes de ${esc(otro.eventoId)} para venir a este, corrige su fecha de salida ahí.</p>
        <div class="form-group"><label>Nueva salida de ${esc(otro.eventoId)}</label><input type="date" id="conf-nueva-salida" value="${esc(c.choque.rango.fin)}" autocomplete="off"></div>
        <button class="btn btn-solid btn-sm" onclick="resolverAjustandoOtro()">Ajustar y asignar</button></div>
      <div class="card"><h4 class="mini-title">Opción 2 · Confirmar en tránsito</h4>
        <p class="hint">Se deja constancia en ambos proyectos de que se dobló a propósito.</p>

function resolverAjustandoOtro(){
  const c=state.conflicto; const nueva=document.getElementById('conf-nueva-salida').value;
  if(!nueva){ toast('Captura la nueva fecha de salida'); return; }
  const otro=c.choque.proyecto; const areaOtroId=c.choque.areaId;
  commit(()=>{
    if(otro.fechasPorArea[areaOtroId]) otro.fechasPorArea[areaOtroId].loadOut=nueva; else otro.fechas.loadOut=nueva;
    otro.updatedAt=Date.now();
    const p=getProyecto(); if(!p.responsablesPorArea[c.areaId]) p.responsablesPorArea[c.areaId]={personaId:null,puesto:'',conflicto:null};
    p.responsablesPorArea[c.areaId].personaId=c.personaId; p.responsablesPorArea[c.areaId].conflicto=null;
  });
  state.conflicto=null; render();
  toast('Fecha ajustada y asignación confirmada');
}
function resolverEnTransito(plantilla){
  const c=state.conflicto; const manual=document.getElementById('conf-nota-manual').value.trim();
  const p=getProyecto(); const otro=c.choque.proyecto;
  commit(()=>{
    if(!p.responsablesPorArea[c.areaId]) p.responsablesPorArea[c.areaId]={personaId:null,puesto:'',conflicto:null};
    p.responsablesPorArea[c.areaId].personaId=c.personaId;
    p.responsablesPorArea[c.areaId].conflicto={proyectoId:otro.id, proyectoNombre:otro.eventoId, plantilla, manual};
    if(!otro.responsablesPorArea[c.choque.areaId]) otro.responsablesPorArea[c.choque.areaId]={personaId:c.choque.personaId,puesto:'',conflicto:null};
    otro.responsablesPorArea[c.choque.areaId].conflicto={proyectoId:p.id, proyectoNombre:p.eventoId, plantilla, manual};
    otro.updatedAt=Date.now();
  });
  state.conflicto=null; render();
  toast('Asignación confirmada, marcada como en tránsito en ambos proyectos');
}

      </div></div>
    <div id="mockup-svg-wrap" style="height:640px;background:#f4f4f4;border-radius:8px">
      <div class="mockup-zoom-ctrl">
        <button onclick="mockupZoom(1.2)" title="Acercar">+</button>
        <button onclick="mockupZoom(0.8)" title="Alejar">−</button>
        <button onclick="mockupZoomReset()" title="Restablecer" style="font-size:14px">⤾</button>
      </div>
      <div id="mockup-svg-inner" style="width:100%;height:100%;transform-origin:center center;will-change:transform">${mockupIsometricoSVG(p, state.mockupVista||'iso1')}</div>
    </div></div>`;
  setTimeout(initMockupPanZoom, 0);
}
function aplicarMockupTransform(){
  const el=document.getElementById('mockup-svg-inner'); if(!el || !state.mockupZoom) return;
  const z=state.mockupZoom;
  el.style.transform = `translate(${z.tx}px,${z.ty}px) scale(${z.scale})`;
}
function mockupZoom(factor){
  if(!state.mockupZoom) state.mockupZoom={scale:1,tx:0,ty:0};
  state.mockupZoom.scale = Math.min(6, Math.max(0.3, state.mockupZoom.scale*factor));
  aplicarMockupTransform();
}
function mockupZoomReset(){ state.mockupZoom={scale:1,tx:0,ty:0}; aplicarMockupTransform(); }
function initMockupPanZoom(){
  const wrap=document.getElementById('mockup-svg-wrap'); if(!wrap) return;
  if(!state.mockupZoom) state.mockupZoom={scale:1,tx:0,ty:0};
  aplicarMockupTransform();
  let dragging=false, lastX=0, lastY=0;
  wrap.onpointerdown=(e)=>{ if(e.target.closest('.mockup-zoom-ctrl')) return; dragging=true; lastX=e.clientX; lastY=e.clientY; try{wrap.setPointerCapture(e.pointerId);}catch(err){} };
  wrap.onpointermove=(e)=>{ if(!dragging) return; state.mockupZoom.tx+=(e.clientX-lastX); state.mockupZoom.ty+=(e.clientY-lastY); lastX=e.clientX; lastY=e.clientY; aplicarMockupTransform(); };
  wrap.onpointerup=()=>{ dragging=false; };
  wrap.onpointercancel=()=>{ dragging=false; };
  wrap.onwheel=(e)=>{ e.preventDefault(); mockupZoom(e.deltaY<0?1.1:0.9); };
}

function addReqGenerico(areaId){ const p=getProyecto(); commit(()=>{ if(!p.reqGenerico[areaId]) p.reqGenerico[areaId]=[]; p.reqGenerico[areaId].push(nuevoRequerimiento()); }); }
function delReqGenerico(areaId,id){ const p=getProyecto(); commit(()=>{ p.reqGenerico[areaId]=(p.reqGenerico[areaId]||[]).filter(r=>r.id!==id); }); }
function setReqGenerico(areaId,id,campo,val){ const p=getProyecto(); const r=(p.reqGenerico[areaId]||[]).find(x=>x.id===id); if(!r) return; commit(()=>{ r[campo]= campo==='cantidad'?Number(val)||0:val; }); }

/* ---- Sub-grupos de un área genérica (ej. Audio -> PA, Monitoreo, RF, Sistemas) ---- */
function secReqGenericoGrupos(p, area, grupos){
  if(!state.tabGenerico) state.tabGenerico={};
  let tabId = state.tabGenerico[area.id];
  if(!tabId || !grupos.some(g=>g.id===tabId)) tabId = state.tabGenerico[area.id] = grupos[0].id;
  const activo = grupos.find(g=>g.id===tabId);
  const conMedidas = (areaById(area.id)||{}).medidas==='xy';
  const filas = activo.items.map(r=>`<tr>
      <td><input value="${esc(r.producto)}" placeholder="Producto o concepto" onchange="setReqSubgrupo('${area.id}','${activo.id}','${r.id}','producto',this.value)" autocomplete="off"></td>
      <td><input value="${esc(r.descripcion)}" placeholder="Descripción" onchange="setReqSubgrupo('${area.id}','${activo.id}','${r.id}','descripcion',this.value)" autocomplete="off"></td>
      ${conMedidas?`<td class="c-num"><input type="number" step="any" placeholder="Ancho" value="${r.ancho||''}" onchange="setReqSubgrupo('${area.id}','${activo.id}','${r.id}','ancho',this.value)" autocomplete="off"></td>
      <td class="c-num"><input type="number" step="any" placeholder="Alto" value="${r.alto||''}" onchange="setReqSubgrupo('${area.id}','${activo.id}','${r.id}','alto',this.value)" autocomplete="off"></td>`:''}
      <td class="c-num"><input type="number" value="${r.cantidad}" onchange="setReqSubgrupo('${area.id}','${activo.id}','${r.id}','cantidad',this.value)" autocomplete="off"></td>
      <td><input value="${esc(r.nota)}" placeholder="Nota" onchange="setReqSubgrupo('${area.id}','${activo.id}','${r.id}','nota',this.value)" autocomplete="off"></td>
      <td><button class="btn-icon-del" onclick="delReqSubgrupo('${area.id}','${activo.id}','${r.id}')">×</button></td></tr>`).join('') || `<tr><td colspan="${conMedidas?7:5}" class="muted" style="padding:16px;text-align:center">Sin requerimientos capturados.</td></tr>`;
  return `<div class="card"><h3 class="subsection-title" style="margin-top:0">${esc(area.nombre)}</h3>
    <div class="top-tabs">${grupos.map(g=>`<button class="ttab${g.id===tabId?' active':''}" onclick="state.tabGenerico['${area.id}']='${g.id}';render()">${esc(g.nombre)}</button>`).join('')}<button class="ttab" title="Agregar sub-grupo" onclick="agregarSubgrupo('${area.id}')">+</button></div>
    <div class="table-wrap"><table class="app-table grid-lineas"><thead><tr><th>Producto</th><th>Descripción</th>${conMedidas?'<th class="num">Ancho (m)</th><th class="num">Alto (m)</th>':''}<th class="num">Cantidad</th><th>Nota</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="addReqSubgrupo('${area.id}','${activo.id}')">+ Requerimiento</button>
    <button class="btn btn-ghost btn-sm" style="color:#E4372B;border-color:#E4372B" onclick="quitarSubgrupo('${area.id}','${activo.id}')">Quitar "${esc(activo.nombre)}"</button></div></div>`;
}
function addReqSubgrupo(areaId,grupoId){ const p=getProyecto(); const g=(p.reqGenericoGrupos[areaId]||[]).find(x=>x.id===grupoId); if(!g) return; commit(()=>{ g.items.push(nuevoRequerimiento()); }); }
function delReqSubgrupo(areaId,grupoId,itemId){ const p=getProyecto(); const g=(p.reqGenericoGrupos[areaId]||[]).find(x=>x.id===grupoId); if(!g) return; commit(()=>{ g.items=g.items.filter(r=>r.id!==itemId); }); }
function setReqSubgrupo(areaId,grupoId,itemId,campo,val){ const p=getProyecto(); const g=(p.reqGenericoGrupos[areaId]||[]).find(x=>x.id===grupoId); const r=g&&g.items.find(x=>x.id===itemId); if(!r) return; commit(()=>{ r[campo]= (campo==='cantidad'||campo==='ancho'||campo==='alto')?Number(val)||0:val; }); }
function agregarSubgrupo(areaId){
  pedirTexto('Nombre del nuevo sub-grupo', nombre=>{
    const p=getProyecto(); if(!p.reqGenericoGrupos[areaId]) p.reqGenericoGrupos[areaId]=[];
    const g=nuevoSubgrupoReq(nombre);
    commit(()=>{ p.reqGenericoGrupos[areaId].push(g); });
    if(!state.tabGenerico) state.tabGenerico={}; state.tabGenerico[areaId]=g.id;
  }, '', 'Ej. RF');
}
function quitarSubgrupo(areaId,grupoId){
  pedirConfirmacion('¿Quitar este sub-grupo y sus requerimientos capturados?', ()=>{
    const p=getProyecto();
    commit(()=>{ p.reqGenericoGrupos[areaId]=(p.reqGenericoGrupos[areaId]||[]).filter(g=>g.id!==grupoId); });
    if(state.tabGenerico) delete state.tabGenerico[areaId];
  }, 'Quitar');
}
function dividirEnSubgrupos(areaId){
  pedirTexto('Nombre del primer sub-grupo', nombre=>{
    const p=getProyecto(); const existentes=p.reqGenerico[areaId]||[];
    const g={id:uuid(), nombre, items:existentes};
    commit(()=>{ p.reqGenericoGrupos[areaId]=[g]; p.reqGenerico[areaId]=[]; });
    if(!state.tabGenerico) state.tabGenerico={}; state.tabGenerico[areaId]=g.id;
  }, '', 'Ej. PA');
}

function pvNominaProyector(p, alcance){
  // alcance: {tipo:'todos'} | {tipo:'area', areaId} | {tipo:'persona', personaId}
  let crew = p.proyector.crew;
  let titulo='Nómina — Todos';
  if(alcance && alcance.tipo==='area'){ crew=crew.filter(c=>c.area===alcance.areaId); titulo='Nómina — '+(areaByIdProy(p,alcance.areaId)||{}).nombre; }
  if(alcance && alcance.tipo==='persona'){ crew=crew.filter(c=>c.personaId===alcance.personaId); titulo='Nómina — '+(nombrePersona(alcance.personaId)||'Persona'); }
  const tiposCols = listaTiposDia();
  const filas = crew.map(c=>{
    const r=calcularPersonaProyector(p,c); const puesto=(C().puestosPago||[]).find(x=>x.id===c.puestoId); const area=areaByIdProy(p,c.area);
    const rango=rangoDeArea(p,c.area); const conteo=Object.fromEntries(tiposCols.map(t=>[t,0]));
    if(rango) diasDeRango(rango.ini,rango.fin).forEach(f=>{ const t=turnoEfectivoProyector(p,c,f); if(t!=null && conteo[t]!==undefined) conteo[t]++; });
    return `<tr><td>${esc(nombrePersona(c.personaId)||'Sin nombre')}</td><td>${esc(area?area.nombre:'—')}</td><td>${esc(puesto?puesto.nombre:'—')}</td><td class="num">${r.diasTrabajados}</td>${tiposCols.map(t=>`<td class="num">${conteo[t]}</td>`).join('')}<td class="num">${r.puntos.toFixed(1)}</td><td class="num">${fmtMXN(r.pago)}</td><td class="num">${fmtMXN(r.viaticos)}</td><td class="num">${fmtMXN(r.total)}</td></tr>`;
  }).join('');

function pvDesgloseTracker(p){
  const t=sincronizarTracker(p);

  factsDeTrk(p).forEach(f=>{
    const pk=f.rubro?(provDeRubroTrk(f.rubro)||'__sinprov'):'__sin', rk=f.rubro||'__sin';
    const get=(mp,k)=>{ let o=mp.get(k); if(!o){ o={pres:0,real:0,h:new Map()}; mp.set(k,o); } return o; };
    const a=get(provs,pk), b=get(a.h,rk); [a,b].forEach(o=>{ o.pres+=f.pres; o.real+=f.real; });
  });
  let filas='';
  provs.forEach((pv,pk)=>{
    filas+=`<tr style="font-weight:700;background:#f6f6f6"><td>${esc(pk==='__sin'?'Sin clasificar':(provByIdTrk(pk)||{}).nombre||'Sin proveedor')}</td><td class="num">${fmtMXN(pv.pres)}</td><td class="num">${fmtMXN(pv.real)}</td><td class="num">${fmtMXN(pv.pres-pv.real)}</td></tr>`;

  });
  return `<div class="pv-page">${pvHead(p,'Tracker')}<div class="pv-section-title">Desglose por proveedor interno → rubro</div>

}

/* ---------------- Importar proyecto(s) ---------------- */
function importarProyectosArchivo(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ if(!inp.files[0]) return; const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result); let lista=[];
      if(d.app==='marabunta-proyecto' && d.proyecto) lista=[d.proyecto];
      else if(d.app==='marabunta-proyectos' && Array.isArray(d.proyectos)) lista=d.proyectos;
      else { toast('Ese archivo no es un proyecto de esta app'); return; }
      let nuevos=0, act=0;
      lista.forEach(pr=>{
        const ep=ensureProyecto(pr); const i=state.proyectos.findIndex(x=>norm(x.eventoId)===norm(ep.eventoId));
        if(i>=0){ ep.id=state.proyectos[i].id; state.proyectos[i]=ep; act++; } else { state.proyectos.push(ep); nuevos++; }
      });
      persistProyectos(); toast(`${nuevos} nuevo(s) · ${act} actualizado(s)`); render();
    }catch(e){ toast('No se pudo leer el archivo'); } };
    r.readAsText(inp.files[0]);
  };
  inp.click();
}

function optsPuesto(areaId, selNombre){

  h += lista.map(x=>`<option value="${esc(x.nombre)}"${norm(x.nombre)===norm(selNombre)?' selected':''}>${esc(x.nombre)}</option>`).join('');

function guardarPersona(){
  const v=id=>document.getElementById(id).value.trim();
  const nombre=v('fp-nombre'), curp=normCURP(v('fp-curp'));
  if(!nombre){ toast('Escribe el nombre completo'); return; }
  if(curp){ const dup=buscarPorCURP(curp, state.editId||undefined); if(dup){ toast(`Ese CURP ya está en el roster como "${dup.nombre}"`); return; } }
  const dc3=document.getElementById('fp-dc3').value, puestoSel=document.getElementById('fp-puesto').value;
  if(puestoSel==='__nuevo__'){ toast('Termina de agregar el puesto antes de guardar'); return; }
  const datos={nombre, curp, idExterno:v('fp-idExterno'), area:document.getElementById('fp-area').value, proveedorId:document.getElementById('fp-proveedor').value||null, puesto:puestoSel, fechaNacimiento:v('fp-fechaNacimiento'), tipoSangre:document.getElementById('fp-tipoSangre').value, telefono:v('fp-telefono'), notas:v('fp-notas'), banco:v('fp-banco'), cuenta:v('fp-cuenta'), clabe:v('fp-clabe'), dc3, dc3Numero: dc3==='SI'?v('fp-dc3Numero'):''};
  if(state.editId){ const p=state.roster.find(x=>x.id===state.editId); Object.assign(p,datos); }
  else state.roster.push(nuevaPersona(datos));
  persistPersonas(); state.mostrarNuevo=false; state.editId=null; render();

function bindSyncDropzone(){
  const dz=document.getElementById('dz'), fi=document.getElementById('fileimp'); if(!dz) return;
  const leer=file=>{
    const r=new FileReader();
    if(/\.xlsx$|\.xls$/i.test(file.name)){ r.onload=()=>cargarWorkbookSync(r.result,file.name); r.readAsArrayBuffer(file); }
    else { r.onload=()=>cargarTextoSync(r.result,file.name); r.readAsText(file,'UTF-8'); }
  };
  dz.onclick=()=>fi.click(); fi.onchange=()=>{ if(fi.files[0]) leer(fi.files[0]); };
  dz.ondragover=e=>{ e.preventDefault(); dz.classList.add('over'); }; dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove('over'); if(e.dataTransfer.files[0]) leer(e.dataTransfer.files[0]); };
}

  if(a.rubros.some(r=>norm(r)===norm(val))){ toast('Ese rubro ya está en la lista'); return; }

function exportarRosterJSON(){ descargar('roster_marabunta_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({app:'marabunta-roster', version:1, exportedAt:new Date().toISOString(), cat:state.cat, personas:state.roster},null,1)); }
function exportarRosterCSV(){
  const H=['ID interno','Nombre completo','CURP','Fecha de nacimiento','Tipo de sangre','Área','Puesto','Teléfono','Notas','Banco','Cuenta','CLABE','DC-3','Número de DC-3','Activo'];
  const esc2=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows=state.roster.map(p=>[p.idExterno,p.nombre,p.curp,p.fechaNacimiento,p.tipoSangre,areaNombre(p.area),p.puesto,p.telefono,p.notas,p.banco,p.cuenta,p.clabe,p.dc3,p.dc3Numero,p.activo?'Sí':'No']);
  descargar('roster_marabunta_'+new Date().toISOString().slice(0,10)+'.csv', H.join(',')+'\n'+rows.map(r=>r.map(esc2).join(',')).join('\n')+'\n','text/csv');
}
function importarRosterJSON(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(d.app!=='marabunta-roster'){ toast('Ese archivo no es un roster de esta app'); return; }
    pedirConfirmacion('Esto reemplaza todo el roster actual. ¿Continuar?', ()=>{
      state.cat=Object.assign(catDefault(), d.cat||{}); state.roster=(d.personas||[]).map(ensurePersona);
      persistCat(); persistPersonas(); toast('Roster importado'); render();
    }, 'Reemplazar');
  }catch(e){ toast('No se pudo leer el archivo'); } };
  r.readAsText(file);
}
function borrarRoster(){ pedirConfirmacion('¿Borrar TODO el roster de este navegador? No se puede deshacer.', ()=>{ state.roster=[]; persistPersonas(); toast('Roster borrado'); render(); }, 'Borrar todo'); }

    <h2 class="section-title">Proyectos</h2>
    <div class="card"><h3 class="subsection-title" style="margin-top:0">Exportar</h3>
      <div class="row"><button class="btn btn-solid" onclick="exportarTodos()">Exportar todos los proyectos</button><button class="btn btn-ghost" onclick="exportarCSVResumen()">Exportar resumen (CSV)</button></div></div>
    <div class="card"><h3 class="subsection-title" style="margin-top:0">Importar</h3><p class="hint">Un respaldo completo reemplaza todos tus proyectos, giras, venues y planes de contingencia. Un archivo de "todos los proyectos" de otro PM se agrega o actualiza por ID de evento (útil para revisar disponibilidad cruzada).</p>
      <input type="file" accept=".json,application/json" onchange="importarRespaldo(this.files[0])" autocomplete="off"></div>
    <div class="card"><h3 class="subsection-title" style="margin-top:0">Borrar datos</h3><button class="btn btn-danger" onclick="borrarTodo()">Borrar todos los proyectos</button></div>
    <p class="hint">El respaldo y borrado del roster se movieron a <a href="#" onclick="ir('config');return false" style="color:var(--accent-text)">Configuración</a>.</p>`;
}
function exportarTodos(){ descargar('brief_todos_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({app:'marabunta-proyectos',version:1,exportedAt:new Date().toISOString(),proyectos:state.proyectos,giras:state.giras,venues:state.venues,planesContingencia:state.planesContingencia},null,1)); }
function exportarCSVResumen(){ descargar('brief_resumen_'+new Date().toISOString().slice(0,10)+'.csv', csvResumen(), 'text/csv'); }
function importarRespaldo(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(d.app==='marabunta-proyectos' && Array.isArray(d.proyectos)){
      pedirConfirmacion('Esto reemplaza TODOS tus proyectos actuales. ¿Continuar?', ()=>{
        state.proyectos=d.proyectos.map(ensureProyecto);
        if(Array.isArray(d.giras)){ state.giras=d.giras; persistGiras(); }
        if(Array.isArray(d.venues)){ state.venues=d.venues; persistVenues(); }
        if(Array.isArray(d.planesContingencia)){ state.planesContingencia=d.planesContingencia; persistPlanes(); }
        persistProyectos(); toast('Respaldo restaurado'); render();
      }, 'Reemplazar');
    } else toast('El archivo no es un respaldo de esta app');
  }catch(e){ toast('No se pudo leer el archivo'); } };
  r.readAsText(file);
}
function borrarTodo(){ pedirConfirmacion('¿Borrar TODOS los proyectos de este navegador? No se puede deshacer.', async ()=>{ state.proyectos=[]; if(usandoSupabase()){ try{ await window.marabuntaDB.eliminarTodosLosProyectos(); }catch(e){ toast(e.message||'No se pudo borrar'); } } else { persistProyectos(); } toast('Proyectos borrados'); render(); }, 'Borrar todo'); }

/* ---------------- Arranque ---------------- */
// Menú del topbar: se abre al pasar el cursor (desktop) o al tocar el ícono (móvil/touch);
// un solo listener delegado porque el topbar se vuelve a dibujar en cada render().
document.addEventListener('click', (e)=>{
  const hr = document.querySelector('.hover-reveal'); if(!hr) return;
  if(e.target.closest('.hover-handle')){ hr.classList.toggle('open'); return; }
  if(!e.target.closest('.hover-reveal')) hr.classList.remove('open');
});
// ---------- Aviso de guardado pendiente ----------
// Guardar ahora viaja por internet (antes era instantáneo, local). Si se
// cierra la pestaña justo después de capturar algo, ese guardado puede
// quedar a la mitad y perderse. Esto muestra un indicador mientras hay
// guardados en vuelo, y avisa al navegador que no cierre todavía si se
// intenta cerrar con algo pendiente.
window.addEventListener('marabunta:pending-change', (e)=>{
  const el = document.getElementById('guardandoIndicator');
  if(el) el.style.display = e.detail.pendientes > 0 ? 'block' : 'none';
});
window.addEventListener('beforeunload', (e)=>{
  if((window.marabuntaPendingWrites||0) > 0){
    e.preventDefault();
    e.returnValue = '';
  }
});

async function arrancarApp(){
  await loadAll();
  document.body.classList.toggle('theme-light', state.theme==='light');
  render();
}

// ---------- Login (Supabase) ----------
// Si src/supabase-client.js cargó (window.marabuntaDB existe), la app pide
// iniciar sesión antes de arrancar y, al autenticar, cambia Store a
// SupabaseStore para que todo se guarde en la base de datos compartida en
// vez del navegador local. Si Supabase no está configurado (archivos no
// cargados, o abierto como archivo .html suelto), la app arranca igual
// que siempre, en modo local.
(async function boot(){
  if(!window.marabuntaDB){ await arrancarApp(); return; }

  const overlay = document.getElementById('loginOverlay');
  const form = document.getElementById('loginForm');
  const err = document.getElementById('loginError');

  async function entrarConSesion(){
    Store = window.SupabaseStore;
    overlay.style.display = 'none';
    await arrancarApp();
  }

  try{
    const sesion = await window.marabuntaDB.sesionActual();
    if(sesion){ await entrarConSesion(); return; }
  }catch(e){}

  overlay.style.display = 'flex';
  form.addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    err.style.display = 'none';
    const email = form.email.value.trim();
    const password = form.password.value;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try{
      await window.marabuntaDB.signIn(email, password);
      await entrarConSesion();
    }catch(e){
      err.textContent = 'No se pudo iniciar sesión: ' + (e.message||'revisa tu correo y contraseña.');
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
})();

</script>
</body>
