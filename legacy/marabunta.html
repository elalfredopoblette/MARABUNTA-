<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marabunta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --black:#000000;
    --lime:#B7F600;
    --mine:#333333;
    --steelgray:#A2A6A9;
    --lightgray:#E5E6E8;
    --white:#FFFFFF;
    --blue:#1E30F2;
    --ease-spring: cubic-bezier(0.34, 1.32, 0.32, 1);
    --font-title: 'Century Gothic', 'Arial Narrow', Arial, sans-serif;
    --font-sub: 'Arial Narrow', Arial, sans-serif;
    --font-body: 'Helvetica Neue', Arial, sans-serif;

    --surf-0:#0a0a0b; --surf-1:#101012; --surf-2:#161618; --surf-3:#1c1c1f; --surf-4:#222226; --surf-5:#212124;
    --surf-card:#333333; --surf-subhead:#111111;
    --border-c:#444444; --border-soft:#333333; --border-strong:#555555;
    --text-1:#FFFFFF; --text-2:#A2A6A9; --text-3:#888888;
    --input-bg:#000000;
    --total-bg:#1c2400; --total-cell-bg:#141a00;
    --accent-text:#B7F600;
    --accent-tint: rgba(183,246,0,0.14);
  }
  body.theme-light{
    --surf-0:#f4f5f6; --surf-1:#ffffff; --surf-2:#eef0f1; --surf-3:#e9ebec; --surf-4:#e2e4e6; --surf-5:#eef0f1;
    --surf-card:#ffffff; --surf-subhead:#eef0f1;
    --border-c:#d7dadc; --border-soft:#e4e6e8; --border-strong:#b9bdc0;
    --text-1:#141617; --text-2:#585d60; --text-3:#84898c;
    --input-bg:#ffffff;
    --total-bg:#e9f6c4; --total-cell-bg:#f2f9dd;
    --accent-text:#5c7a00;
    --accent-tint: rgba(92,122,0,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surf-0);color:var(--text-1);font-family:var(--font-body);transition:background .15s,color .15s;}
  #app{min-height:100vh;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surf-0);border-bottom:2px solid var(--lime);position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{height:24px;display:flex;align-items:center;}
  .brand-logo svg{height:100%;width:auto;display:block;}
  .brand-logo svg path{fill:var(--text-1);transition:fill .15s;}
  .brand-sub{font-family:var(--font-sub);font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;}
  .top-actions{display:flex;gap:8px;align-items:center;}
  .theme-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--surf-card);border:1px solid var(--border-c);cursor:pointer;font-size:15px;}
  .theme-toggle:hover{border-color:var(--lime);}
  .chip{background:var(--lime);color:#000;font-family:var(--font-sub);font-weight:700;font-size:10.5px;letter-spacing:0.5px;padding:6px 12px;text-transform:uppercase;border-radius:3px;}
  .top-actions .btn.active-view{background:var(--lime);color:#000;}

  .corner-links{display:flex;gap:6px;align-items:center;margin-top:2px;}
  .corner-link{background:none;border:none;padding:0;font-family:var(--font-sub);font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;}
  .corner-link:hover, .corner-link.active{color:var(--accent-text);}
  .corner-sep{color:var(--text-3);font-size:9px;}

  .print-disclaimer{display:none;}
  #printable-report{display:none;}
  @media print{
    @page{ size: landscape; margin: 12mm; }
    .print-disclaimer{
      display:block;position:fixed;bottom:0;left:0;right:0;
      text-align:center;padding:6px 10px;border-top:1px solid #000;
      font-family:var(--font-sub);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;
      color:#000;background:#fff;
    }
    #app{display:none !important;}
    #printable-report{display:block !important;}
    body{background:#fff;color:#000;}
  }

  /* ---- Reporte imprimible (portada + tablas + resumen ejecutivo) ---- */
  .print-page{padding:20px 30px;page-break-after:always;background:#fff;color:#000;}
  .print-page:last-child{page-break-after:auto;}
  .print-meta{font-family:var(--font-sub);font-size:13px;color:#333;letter-spacing:0.3px;}
  .print-page-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:16px;}
  .print-page-header-brand{display:flex;align-items:center;gap:9px;}
  .print-page-header-logo{height:18px;}
  .print-page-header-logo svg{height:100%;width:auto;display:block;}
  .print-page-header-logo svg path{fill:#000 !important;}
  .print-page-header-divider{width:2px;height:14px;background:#B7F600;}
  .print-page-header-label{font-family:var(--font-sub);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#000;}
  .print-page-badge{border:1.5px solid #000;padding:5px 14px;font-family:var(--font-sub);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
  .print-section-title{background:#B7F600;color:#000;font-family:var(--font-title);font-size:15px;text-transform:uppercase;letter-spacing:0.4px;padding:8px 12px;margin:0 0 14px;}
  .print-area-title{font-family:var(--font-sub);font-weight:700;text-transform:uppercase;font-size:12.5px;margin:12px 0 5px;}
  .print-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0 0 14px;padding:8px 10px;border:1px solid #ccc;border-radius:4px;background:#fafafa;}
  .print-legend-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:10px;color:#000;}
  .print-legend-swatch{display:inline-flex;align-items:center;justify-content:center;width:24px;height:16px;border-radius:2px;font-weight:800;font-size:9px;font-family:var(--font-sub);}
  .print-repeat-title{background:#B7F600 !important;color:#000 !important;font-family:var(--font-title);font-size:12px;text-align:left;text-transform:uppercase;letter-spacing:0.4px;padding:6px 8px;border:none;}
  .print-repeat-legend{background:#fafafa !important;color:#000 !important;border:1px solid #ccc;padding:5px 8px;text-align:left;text-transform:none;}
  .print-repeat-legend .print-legend{margin:0;border:none;background:none;padding:0;}
  table.print-table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:12px;}
  .print-table th, .print-table td{border:1px solid #000;padding:4px 6px;text-align:left;color:#000;}
  .print-table th{background:#000;color:#fff;text-transform:uppercase;font-family:var(--font-sub);font-size:9.5px;letter-spacing:0.3px;}
  .print-table tbody tr:nth-child(even){background:#f7f7f7;}
  .print-table tr.print-subtotal{background:#e9e9e9 !important;font-weight:700;}
  .print-exec-totals{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;page-break-inside:avoid;break-inside:avoid;}
  .print-two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start;}
  .print-two-col .print-table{margin-bottom:6px;}
  .print-two-col .print-area-title{margin-top:0;}
  .print-exec-box{border:1px solid #000;padding:7px 12px;flex:1;min-width:130px;page-break-inside:avoid;break-inside:avoid;}
  .print-exec-box.general{border-width:2px;}
  .print-exec-box .label{font-size:9.5px;text-transform:uppercase;font-family:var(--font-sub);color:#555;letter-spacing:0.3px;}
  .print-exec-box .value{font-size:17px;font-weight:800;margin-top:3px;}

  /* Portada, inspirada en el diseño del Planeador de Requerimientos Operativos */
  .print-cover-header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:24px;}
  .print-cover-brand{display:flex;align-items:center;gap:10px;}
  .print-cover-brand-logo{height:24px;}
  .print-cover-brand-logo svg{height:100%;width:auto;display:block;}
  .print-cover-brand-logo svg path{fill:#000 !important;}
  .print-cover-brand-tag{font-family:var(--font-sub);font-size:11px;font-weight:700;text-transform:uppercase;color:#000;border-left:2px solid #000;padding-left:8px;}
  .print-cover-chip{background:#000;color:#B7F600;font-size:9px;padding:5px 10px;font-family:var(--font-sub);text-transform:uppercase;letter-spacing:0.5px;}
  .print-cover-kicker{font-family:var(--font-sub);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#5c7a00;border-left:4px solid #B7F600;padding-left:9px;margin-bottom:10px;}
  .print-cover-title{font-family:var(--font-title);font-size:26px;text-transform:uppercase;margin:0 0 16px;color:#000;}
  .print-cover-meta-list{border-top:1px solid #ddd;margin-top:6px;}
  .print-cover-meta-row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #ddd;}
  .print-cover-meta-label{font-family:var(--font-sub);font-size:10.5px;letter-spacing:0.5px;text-transform:uppercase;color:#888;}
  .print-cover-meta-value{font-size:13.5px;font-weight:700;color:#000;text-align:right;font-variant-numeric:tabular-nums;}
  .print-cover-areas-label{font-family:var(--font-sub);font-size:9.5px;letter-spacing:0.5px;text-transform:uppercase;color:#888;margin:16px 0 10px;}
  .print-cover-area-chip{display:inline-flex;align-items:center;gap:6px;background:#000;color:#B7F600;font-size:10px;padding:5px 10px;font-family:var(--font-sub);text-transform:uppercase;font-weight:700;border-radius:2px;margin:0 6px 8px 0;}
  .print-cover-area-chip span{color:#fff;font-weight:400;}
  .print-cover-bottom-bar{display:flex;align-items:center;gap:22px;margin-top:70px;padding-top:14px;border-top:1.5px solid #000;}
  .print-cover-disclaimer{flex:1;font-family:var(--font-body);font-size:11px;line-height:1.5;color:#666;}
  .print-cover-grid{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:28px;align-items:start;}
  .print-cover-flyer{border-radius:6px;overflow:hidden;border:1px solid #ddd;max-height:400px;display:flex;background:#fafafa;}
  .print-cover-flyer img{max-height:400px;width:auto;max-width:230px;object-fit:contain;display:block;margin:0 auto;}

  .btn{font-family:var(--font-sub);text-transform:uppercase;letter-spacing:0.5px;font-size:11.5px;border:1px solid var(--accent-text);background:transparent;color:var(--accent-text);padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:600;transition:background .2s var(--ease-spring),color .2s var(--ease-spring),transform .2s var(--ease-spring);white-space:nowrap;}
  .btn:hover{background:var(--lime);color:#000;}
  .btn:active{transform:scale(0.97);}
  .btn-solid{background:var(--lime);color:#000;}
  .btn-solid:hover{background:var(--white);border-color:var(--white);}
  .btn-ghost{border-color:var(--text-2);color:var(--text-2);}
  .btn-ghost:hover{background:var(--text-2);color:#000;}
  .btn-danger{border-color:#ff4d4d;color:#ff4d4d;}
  .btn-danger:hover{background:#ff4d4d;color:#000;}
  .btn-sm{padding:5px 9px;font-size:10px;}

  .container{max-width:none;margin:0;padding:24px 32px 60px;}
  h1.page-title{font-family:var(--font-title);font-size:22px;margin:0 0 4px;text-transform:uppercase;letter-spacing:0.5px;}
  .page-sub{font-family:var(--font-sub);color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:1px;}

  .tabs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--border-c);flex-wrap:wrap;}
  .tab{font-family:var(--font-sub);text-transform:uppercase;font-size:12px;letter-spacing:0.5px;padding:9px 16px;cursor:pointer;color:var(--text-2);border-bottom:3px solid transparent;font-weight:600;background:none;border-top:none;border-left:none;border-right:none;transition:color .2s var(--ease-spring),border-bottom-color .25s var(--ease-spring);}
  .tab.active{color:var(--accent-text);border-bottom-color:var(--lime);}
  .tab:hover{color:var(--text-1);}

  .shift-toggle{display:inline-flex;background:var(--surf-card);border-radius:3px;overflow:hidden;border:1px solid var(--border-c);}
  .shift-toggle div{padding:8px 14px;font-family:var(--font-sub);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;color:var(--text-2);font-weight:600;transition:background .25s var(--ease-spring),color .2s var(--ease-spring);}
  .shift-toggle div.active{background:var(--lime);color:#000;font-weight:700;}
  .shift-toggle div:hover:not(.active){background:var(--surf-4);color:var(--text-1);}

  h2.section-title{font-family:var(--font-title);font-size:16px;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent-text);margin:30px 0 10px;border-bottom:1px solid var(--border-c);padding-bottom:6px;}
  h3.subsection-title{font-family:var(--font-sub);font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;margin:20px 0 8px;font-weight:700;}
  p.hint{color:var(--text-2);font-size:12px;margin:2px 0 14px;font-family:var(--font-body);}

  .card{background:var(--surf-card);border:1px solid var(--border-c);border-radius:6px;padding:16px 18px;margin-bottom:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .form-group{display:flex;flex-direction:column;gap:4px;}
  .form-group label{display:block;font-family:var(--font-sub);font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-2);margin-bottom:0;}

  input, select{background:var(--input-bg);border:1px solid var(--border-c);color:var(--text-1);border-radius:3px;padding:8px 10px;font-family:var(--font-body);font-size:13px;min-width:90px;}
  input:focus, select:focus{outline:none;border-color:var(--lime);}
  input[type=number]{width:100px;}
  input[type=date]{min-width:150px;}
  .name-input{min-width:160px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border-c);border-radius:6px;}
  table.app-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surf-1);}
  .app-table thead th{background:var(--surf-2);color:var(--text-2);font-family:var(--font-sub);text-transform:uppercase;font-size:10px;letter-spacing:0.4px;padding:8px;border-bottom:1px solid var(--border-c);text-align:left;white-space:nowrap;}
  .app-table thead tr.group-row th{text-align:center;font-size:10.5px;color:var(--accent-text);border-bottom:1px solid var(--border-soft);}
  .app-table tbody td{padding:6px 8px;border-bottom:1px solid var(--border-soft);}
  .app-table tbody tr:hover{background:var(--surf-2);}
  .app-table tr.subtotal{background:var(--surf-3);font-weight:700;}
  .app-table tr.subtotal td{color:var(--accent-text);font-family:var(--font-sub);text-transform:uppercase;font-size:11px;}
  .app-table td.num, .app-table th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .grid-turnos select{min-width:100px;}
  .grid-turnos{ max-width: 100%; }
  .grid-turnos .col-num{ width:26px; min-width:26px; max-width:26px; text-align:center; padding:4px !important; color:var(--text-2); font-family:var(--font-sub); font-size:11px; }
  .grid-turnos .col-del{ width:30px; min-width:30px; max-width:30px; text-align:center; padding:4px !important; }
  .grid-turnos .col-persona{ width:150px; min-width:150px; max-width:150px; }
  .grid-turnos .col-puesto{ width:170px; min-width:170px; max-width:170px; }
  .grid-turnos .col-habitacion{ width:140px; min-width:140px; max-width:140px; padding:4px !important; }
  .grid-turnos th.col-num, .grid-turnos td.col-num,
  .grid-turnos th.col-del, .grid-turnos td.col-del,
  .grid-turnos th.col-persona, .grid-turnos td.col-persona,
  .grid-turnos th.col-puesto, .grid-turnos td.col-puesto,
  .grid-turnos th.col-habitacion, .grid-turnos td.col-habitacion{
    position: sticky; background: var(--surf-1); z-index: 2;
  }
  .grid-turnos th.col-num, .grid-turnos th.col-del, .grid-turnos th.col-persona, .grid-turnos th.col-puesto, .grid-turnos th.col-habitacion{ z-index: 3; background: var(--surf-3); }
  .grid-turnos .col-num{ left: 0; }
  .grid-turnos .col-del{ left: 26px; }
  .grid-turnos .col-persona{ left: 56px; }
  .grid-turnos .col-puesto{ left: 206px; }
  .grid-turnos .col-habitacion{ left: 376px; }
  .grid-turnos tbody tr:nth-child(even) .col-num,
  .grid-turnos tbody tr:nth-child(even) .col-del,
  .grid-turnos tbody tr:nth-child(even) .col-persona,
  .grid-turnos tbody tr:nth-child(even) .col-puesto,
  .grid-turnos tbody tr:nth-child(even) .col-habitacion{ background: var(--surf-2); }
  .btn-icon-del{ background:none; border:none; color:#ff6b6b; font-size:17px; font-weight:700; cursor:pointer; line-height:1; padding:2px 4px; }
  .btn-icon-del:hover{ color:#ff2d2d; }
  .col-group-nac{border-left:2px solid var(--border-strong);}
  .col-group-int{border-left:2px solid var(--border-strong);}

  .totales-evento{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;}
  .sprinters-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:10px;}
  @media (max-width:900px){ .sprinters-layout{grid-template-columns:1fr;} }
  .total-box{background:var(--surf-card);border:1px solid var(--border-c);border-radius:6px;padding:14px 18px;min-width:170px;flex:1;}
  .total-box .label{font-family:var(--font-sub);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);}
  .total-box .value{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--accent-text);}
  .total-box.general{background:var(--total-bg);border-color:var(--lime);}

  .warning-box{border:1px solid var(--lime);background:var(--accent-tint);padding:10px 14px;border-radius:4px;font-size:12px;color:var(--accent-text);margin:10px 0;font-family:var(--font-body);}

  .areas-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surf-card);border:1px solid var(--border-c);border-radius:20px;padding:4px 10px 4px 12px;margin:2px 6px 2px 0;font-size:12px;}
  .areas-tag button{padding:2px 6px;font-size:10px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:10px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-2);}
  .empty-state h2{font-family:var(--font-title);color:var(--text-1);font-size:18px;text-transform:uppercase;}

  footer{text-align:center;color:var(--text-3);font-size:10.5px;padding:20px;border-top:1px solid var(--border-c);margin-top:40px;font-family:var(--font-sub);text-transform:uppercase;letter-spacing:0.5px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--lime);color:#000;padding:10px 18px;border-radius:4px;font-family:var(--font-sub);font-size:12px;text-transform:uppercase;font-weight:700;z-index:200;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

  /* ---- Dashboard: Mis Proyectos (fichas / lista) ---- */
  .dash-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .search-row{display:flex;gap:10px;margin:16px 0;align-items:center;flex-wrap:wrap;}
  .input{background:var(--surf-card);border:1px solid var(--border-strong);color:var(--text-1);padding:8px 12px;border-radius:3px;font-family:var(--font-body);font-size:13px;width:100%;max-width:340px;}
  .input:focus{outline:none;border-color:var(--lime);}

  .top-tabs{display:inline-flex;background:var(--surf-card);border-radius:3px;overflow:hidden;border:1px solid var(--border-c);}
  .ttab{padding:8px 16px;font-family:var(--font-sub);font-size:11px;text-transform:uppercase;letter-spacing:0.4px;cursor:pointer;color:var(--text-2);background:none;border:none;font-weight:600;}
  .ttab.active{background:var(--lime);color:#000;font-weight:700;}
  .ttab:hover:not(.active){color:var(--text-1);}

  .tag{font-size:9px;padding:3px 7px;border-radius:10px;background:var(--black);color:var(--lime);border:1px solid var(--lime);font-family:var(--font-sub);text-transform:uppercase;}

  .event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:8px;}
  .event-card{background:var(--surf-card);border:1px solid var(--border-c);border-radius:6px;padding:15px;cursor:pointer;transition:border-color .2s var(--ease-spring),box-shadow .3s var(--ease-spring),transform .3s var(--ease-spring);}
  .event-card:hover{border-color:var(--lime);box-shadow:0 14px 34px -10px rgba(183,246,0,0.16);transform:translateY(-2px);}
  .event-card h3{font-family:var(--font-title);font-size:15px;margin:0 0 6px;text-transform:uppercase;}
  .event-meta{font-size:11px;color:var(--text-2);font-family:var(--font-sub);text-transform:uppercase;letter-spacing:0.4px;line-height:1.7;}
  .event-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .card-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;}

  .event-list-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border-c);border-radius:5px;background:var(--surf-card);margin-bottom:8px;cursor:pointer;transition:border-color .2s var(--ease-spring);}
  .event-list-row:hover{border-color:var(--lime);}
  .event-list-row .elr-name{font-family:var(--font-title);font-size:14px;text-transform:uppercase;flex:1;min-width:160px;}
  .event-list-row .elr-meta{font-size:11px;color:var(--text-2);font-family:var(--font-sub);text-transform:uppercase;letter-spacing:0.4px;}
  .event-list-row .card-actions{margin-top:0;}

  /* ---- Headers de columna por fecha (crew / hospedaje / transporte) ---- */
  .daycell-head{background:var(--surf-3);padding:8px;text-align:center;min-width:118px;max-width:140px;vertical-align:top;}
  .daycell-date-box{background:var(--input-bg);border:1px solid var(--border-c);border-radius:3px;padding:5px 6px;margin-bottom:5px;}
  .daycell-weekday{font-family:var(--font-sub);font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;}
  .daycell-daynum{font-size:12px;color:var(--text-1);font-weight:700;font-variant-numeric:tabular-nums;}
  .daycell-bulk-select{width:100%;font-size:10px;padding:3px 4px;min-width:0;}
  .auto-cell{background:var(--accent-tint);}
  .auto-cell input{color:var(--accent-text);font-style:italic;}
  input:disabled{opacity:0.35;cursor:not-allowed;background:var(--surf-3);}

  /* ============ Brief de proyecto: extensiones ============ */
  .muted{color:var(--text-2);} .small{font-size:11px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0;}
  .mini-title{font-family:var(--font-sub);text-transform:uppercase;font-size:12px;letter-spacing:.4px;color:var(--text-2);margin:16px 0 8px;}
  .section-title{font-family:var(--font-sub);text-transform:uppercase;font-size:13px;letter-spacing:.4px;color:var(--accent-text);margin:26px 0 10px;}
  .chk-area{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sub);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-right:18px;cursor:pointer;}
  .chk-area input{min-width:0;width:auto;}
  .tag.est-prospecto{background:var(--surf-4);color:var(--text-2);}
  .tag.est-confirmado{background:transparent;border:1px solid var(--border-strong);color:var(--text-1);}
  .tag.est-en_progreso{background:var(--lime);border-color:var(--lime);color:#fff;}
  .tag.est-cerrado{background:var(--steelgray);color:#101010;}
  .tag.est-cancelado{background:var(--warn);border-color:var(--warn);color:#101010;}
  .tag.warn{background:#FFD400;color:#000;}
  .cal-preview{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;}
  .cal-day{flex:0 0 66px;border-radius:4px;padding:6px 4px;text-align:center;font-family:var(--font-sub);font-size:10px;background:var(--surf-3);border:1px solid var(--border-c);}
  .cal-fecha{font-weight:700;} .cal-tipo{text-transform:uppercase;color:var(--text-2);margin-top:2px;}
  .cal-day.cal-previo{border-color:var(--blue);} .cal-day.cal-show{background:var(--lime);color:#000;} .cal-day.cal-show .cal-tipo{color:#000;}
  .cal-day.cal-salida{border-color:#E4002B;}
  .cal-day:has(.viaje-mini){flex:0 0 230px;text-align:left;}
  .viaje-mini{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
  .viaje-mini select,.viaje-mini input{width:100%;font-size:10px;padding:3px 4px;border-radius:3px;border:1px solid var(--border-c);background:var(--input-bg);color:var(--text-1);text-transform:none;text-align:left;}
  .conflicto{border-color:#FFD400;}
  .dash-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start;}
  .grid-lineas input,.grid-lineas select{width:100%;padding:5px 6px;font-size:12px;}
  .grid-lineas td.c-num input{width:76px;text-align:right;}
  .search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;}
  .warn-cell{color:#FFD400;font-weight:800;} body.theme-light .warn-cell{color:#b78b00;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:1px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  .topbar{flex-wrap:wrap;gap:8px;} .top-actions{flex-wrap:wrap;}
  @media (max-width:700px){.container{padding:18px 14px 50px;} .topbar{padding:10px 14px;}}
  @media print{.no-print{display:none!important;}}
  .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-family:var(--font-sub);font-weight:700;font-size:11px;}
  .pill.good{background:#C6EFCE;color:#006100;}
  .app-table tr.row-baja{opacity:.55;}
  .drop-zone{border:2px dashed var(--border-strong);border-radius:6px;padding:34px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;}
  .drop-zone:hover,.drop-zone.over{border-color:var(--lime);background:var(--accent-tint);}
  .cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;} .cfg-row input,.cfg-row select{flex:1;min-width:130px;}
  .btn-mini{background:var(--surf-3);border:1px solid var(--border-c);color:var(--text-2);border-radius:3px;width:24px;height:24px;cursor:pointer;font-size:12px;padding:0;}
  .btn-mini:hover{border-color:var(--lime);color:var(--accent-text);}
  .det-sum{cursor:pointer;font-family:var(--font-sub);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent-text);font-weight:700;}
  details[open] .det-sum{margin-bottom:4px;}
  textarea{background:var(--input-bg);border:1px solid var(--border-c);color:var(--text-1);border-radius:3px;padding:8px 10px;font-family:var(--font-body);font-size:13px;}
  textarea:focus{outline:none;border-color:var(--lime);}
  .cal-day{flex-direction:column;gap:2px;}
  .cal-tipo-sel{width:100%;font-size:9px;padding:1px 2px;border:none;background:transparent;font-family:var(--font-sub);text-transform:uppercase;color:inherit;text-align:center;cursor:pointer;}
  .cal-day.cal-show .cal-tipo-sel{color:#000;}
  .cal-tipo-sel:focus{outline:1px solid var(--lime);}
  .planner-grid th{white-space:nowrap;} .planner-grid td{min-width:110px;}
  .planner-meals{display:flex;flex-direction:column;gap:2px;} .planner-meals input{width:100px;font-size:10px;padding:3px 4px;}
  .planner-cargo select{width:70px;font-size:10px;} .planner-cargo input{width:100px;font-size:10px;margin-top:2px;}
  .planner-cargo{display:flex;flex-direction:column;gap:2px;}
  .auto-cell{background:var(--accent-tint)!important;}

  /* ============ Marabunta — sistema de marca (BVI v1.0) ============
     Reemplaza la paleta anterior por el sistema monocromático + acentos funcionales de Marabunta.
     Azul eléctrico = estado activo / CTA. Ámbar industrial = advertencia / crítico. Nunca decorativos. */
  :root{
    --black:#101010; --lime:#007BFF; --blue:#007BFF; --accent-text:#007BFF;
    --accent-tint: rgba(0,123,255,0.14); --warn:#FF9F0A; --warn-tint: rgba(255,159,10,0.16);
    --total-bg:#0a1f33; --total-cell-bg:#071626;
    --font-title:'Montserrat', 'Inter', sans-serif; --font-sub:'Montserrat', 'Inter', sans-serif;
    --font-body:'Inter', -apple-system, sans-serif; --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  .brand-logo, h1, h2, h3, .subsection-title, .mini-title, .btn, .ttab, .top-tabs button, .page-title{ letter-spacing:.2px; }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-ant{height:26px;width:auto;display:block;border-radius:2px;}
  /* Datos, costos, horarios y cantidades en monoespaciada, como pide el manual */
  .num, .value, td.num, th.num, .app-table td input[type="number"], .kpis .value, .planner-grid td input{ font-family:var(--font-mono); }
  /* Las advertencias usan Ámbar, no el azul de acento — son dos cosas distintas en la marca */
  .warning-box{border-color:var(--warn)!important;background:var(--warn-tint)!important;color:#FFC670!important;}
  body.theme-light .warning-box{color:#8a5800!important;}

  /* El modo claro tenía su propio verde-lima sin tocar — se corrige aparte porque sus variables van
     después del bloque base en el CSS original. */
  body.theme-light{
    --total-bg:#dbeafe; --total-cell-bg:#eff6ff; --accent-text:#0056b3; --accent-tint: rgba(0,123,255,0.08);
  }
  .pill.good{background:#e8e8ea;color:#101010;}
  body.theme-light .pill.good{background:#eef0f1;color:#101010;}
  .pill.bad{background:var(--warn);color:#101010;}

  /* ============ Vistas de Mis Proyectos: Lista, Gantt, Calendario ============ */
  .view-switch{display:flex;gap:2px;background:var(--surf-3);border-radius:6px;padding:2px;}
  .view-switch-btn{background:transparent;border:none;color:var(--text-2);padding:6px 12px;border-radius:5px;cursor:pointer;font-family:var(--font-sub);font-size:12px;font-weight:700;}
  .view-switch-btn.active{background:var(--surf-card);color:var(--text-1);}
  .card-actions{margin-top:8px;display:flex;justify-content:flex-end;}

  .lista-proyectos{display:flex;flex-direction:column;gap:6px;}
  .lista-row{display:flex;align-items:center;gap:14px;background:var(--surf-card);border:1px solid var(--border-c);border-radius:6px;padding:10px 14px;cursor:pointer;}
  .lista-row:hover{border-color:var(--border-strong);}
  .lista-row-main{flex:1;min-width:0;}
  .lista-row-title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .lista-row-title{font-weight:700;}
  .lista-row-meta{color:var(--text-2);font-size:12px;margin-top:2px;}
  .lista-row-dates{font-family:var(--font-mono);font-size:12px;color:var(--text-2);white-space:nowrap;}
  .lista-row-actions{display:flex;gap:4px;}

  .gantt-wrap{background:var(--surf-card);border:1px solid var(--border-c);border-radius:6px;overflow:hidden;}
  .gantt-scroll{overflow-x:auto;}
  .gantt-header{position:relative;height:32px;border-bottom:1px solid var(--border-c);}
  .gantt-header-spacer{position:absolute;left:0;top:0;width:180px;height:100%;background:var(--surf-card);z-index:2;border-right:1px solid var(--border-c);}
  .gantt-header-track{position:relative;margin-left:180px;height:100%;}
  .gantt-month{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:6px;font-size:11px;font-weight:700;text-transform:capitalize;color:var(--text-2);border-left:1px solid var(--border-soft);box-sizing:border-box;}
  .gantt-body{position:relative;}
  .gantt-row{display:flex;border-bottom:1px solid var(--border-soft);}
  .gantt-row-label{width:180px;flex-shrink:0;padding:8px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--surf-card);position:sticky;left:0;z-index:1;border-right:1px solid var(--border-c);}
  .gantt-row-track{position:relative;height:36px;}
  .gantt-chip{position:absolute;top:6px;height:24px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#101010;white-space:nowrap;overflow:hidden;cursor:pointer;}
  .gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);z-index:1;}

  .cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:12px;font-size:11px;text-transform:uppercase;color:var(--text-2);text-align:center;padding-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border-soft);}
  .cal-cell{background:var(--surf-card);min-height:80px;padding:4px;font-size:11px;}
  .cal-cell-empty{background:var(--surf-2);}
  .cal-cell-num{color:var(--text-2);margin-bottom:2px;}
  .cal-cell-chip{background:var(--accent-tint);color:var(--accent-text);border-radius:3px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}

  /* ============ Dashboard de eficiencia del Tracker ============ */
  .dash-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .dash-bar-label{width:150px;flex-shrink:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dash-bar-track{flex:1;height:16px;background:var(--surf-2);border-radius:3px;overflow:hidden;}
  .dash-bar-fill{height:100%;background:var(--accent-text);border-radius:3px;}
  .dash-bar-fill.over{background:var(--warn);}
  .dash-bar-val{width:190px;flex-shrink:0;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-2);}

  /* ============ Selector de secciones a incluir en cada PDF ============ */
  .pdf-secciones{display:inline-block;position:relative;}
  .pdf-secciones summary{cursor:pointer;list-style:none;}
  .pdf-secciones summary::-webkit-details-marker{display:none;}
  .pdf-secciones-panel{position:absolute;z-index:50;background:var(--surf-card);border:1px solid var(--border-strong);border-radius:6px;padding:10px 14px;margin-top:4px;display:flex;flex-direction:column;gap:6px;min-width:210px;box-shadow:0 4px 14px rgba(0,0,0,0.4);}

  /* ============ Turno Día/Noche en el Planner ============ */
  .turno-sub{font-size:9px!important;text-transform:uppercase;opacity:.7;padding:2px 4px!important;}

  /* ============ Auditoría móvil — correcciones de UX/UI ============ */

  /* Menú "Más" del topbar: oculto en desktop (los botones van directo), colapsado en móvil */
  .mas-menu{display:none;}
  .mas-menu summary{cursor:pointer;list-style:none;}
  .mas-menu summary::-webkit-details-marker{display:none;}
  .mas-menu-panel{position:absolute;right:14px;margin-top:4px;background:var(--surf-card);border:1px solid var(--border-strong);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:200;min-width:170px;box-shadow:0 4px 14px rgba(0,0,0,.45);}
  .mas-menu-panel .btn{width:100%;text-align:left;}

  /* Botonera secundaria de un proyecto (Exportar/Enviar/Imprimir/Eliminar): siempre visible en
     desktop, colapsada bajo "Más acciones" en móvil, para no alargar la pantalla de golpe. */
  .collapse-mobile summary{cursor:pointer;list-style:none;}
  .collapse-mobile summary::-webkit-details-marker{display:none;}
  .collapse-mobile-body{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  @media (min-width:601px){
    .collapse-mobile > summary{display:none;}
    .collapse-mobile > .collapse-mobile-body{display:flex!important;}
  }

  /* Calendario: mostrar el texto corto (‹ ›) solo en pantallas angostas */
  .txt-short{display:none;}

  /* Aviso visual de que una tabla ancha sigue hacia la derecha (se puede deslizar) */
  .table-wrap{ -webkit-mask-image:none; mask-image:none; }

  @media (max-width:600px){
    /* --- Topbar: colapsar Giras/Venues/Contingencias/Respaldo bajo "☰ Más" --- */
    .top-actions-desktop-only{display:none;}
    .mas-menu{display:inline-block;position:relative;}

    /* --- Tabs de estado (Todos/Prospecto/...): que hagan scroll en vez de cortarse --- */
    .top-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;scrollbar-width:thin;}
    .ttab{white-space:nowrap;flex:0 0 auto;}

    /* --- Tablas anchas: aviso de que se puede deslizar (degradado en el borde derecho) --- */
    .table-wrap{
      -webkit-mask-image:linear-gradient(to right, black calc(100% - 22px), transparent 100%);
      mask-image:linear-gradient(to right, black calc(100% - 22px), transparent 100%);
    }

    /* --- Calendario: Anterior/Siguiente compactos, en una sola fila con el título --- */
    .cal-nav .btn{padding:8px 10px;flex-shrink:0;}
    .txt-full{display:none;}
    .txt-short{display:inline;font-size:16px;font-weight:800;}

    /* --- Objetivos de toque más grandes: botones, selects e inputs más cómodos con el dedo --- */
    .btn, select, input[type="text"], input[type="number"], input[type="date"]{min-height:40px;}
    .btn-icon-del{min-width:32px;min-height:32px;font-size:14px;}
    .ttab{padding:10px 14px;}
    .view-switch-btn{padding:9px 12px;}
    .chk-area, .cal-cell-chip{min-height:28px;}

    /* --- Tabla de Niveles (plan de contingencia): tarjetas apiladas en vez de tabla rígida,
       para que "Acciones" (lo más importante) nunca quede fuera de la pantalla --- */
    .stack-table thead{display:none;}
    .stack-table, .stack-table tbody, .stack-table tr, .stack-table td{display:block;width:100%;}
    .stack-table{ -webkit-mask-image:none!important; mask-image:none!important; }
    .stack-table tr{border:1px solid var(--border-c);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--surf-1);}
    .stack-table td{border:none;padding:6px 0;}
    .stack-table td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-family:var(--font-sub);font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);margin-bottom:3px;}
    .stack-table td[data-label] input, .stack-table td[data-label] textarea{width:100%;}
  }

  /* ============ Home dashboard + logo como link ============ */
  a.brand{text-decoration:none;color:inherit;cursor:pointer;}
  .home-row{padding:10px 0;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .home-row:last-child{border-bottom:none;}
  .home-row:hover{background:var(--surf-2);}

  /* ============ Mejoras de escritorio (pantallas anchas) ============ */
  .warning-box a{color:inherit;text-decoration:underline;font-weight:700;}
  .btn-mini-wide{width:auto;padding:0 8px;height:24px;white-space:nowrap;}
  .kpi-alerta{border-color:var(--warn);} .kpi-alerta .value{color:var(--warn);}

  /* Barra de total pegada bajo el topbar (Crew) */
  .sticky-total{position:sticky;top:var(--topbar-h,48px);z-index:30;display:flex;gap:18px;flex-wrap:wrap;align-items:center;
    background:var(--surf-2);border:1px solid var(--border-c);border-radius:6px;padding:8px 14px;margin:0 0 12px;font-size:12px;color:var(--text-2);}
  .sticky-total b{color:var(--text-1);font-family:var(--font-mono);}
  .sticky-total-main{margin-left:auto;color:var(--accent-text);} .sticky-total-main b{color:var(--accent-text);font-size:14px;}
  @media (max-width:600px){
    .sticky-total{flex-wrap:nowrap;gap:10px;padding:6px 10px;}
    .sticky-total span:not(:first-child):not(.sticky-total-main){display:none;}
  }

  /* Planner: columna de nombres fija al deslizar fechas */
  .lbl-fila{min-width:130px;}
  @media (min-width:900px){
    .lbl-fila{min-width:190px;}
    .planner-grid td:first-child, .planner-grid th:first-child{position:sticky;left:0;z-index:2;background:var(--surf-1);box-shadow:1px 0 0 var(--border-c);}
    .planner-grid thead th:first-child{background:var(--surf-2);}
    .planner-grid tbody tr:hover td:first-child{background:var(--surf-2);}
  }

  /* Roster: encabezado fijo con scroll interno */
  @media (min-width:900px){
    .sticky-head-wrap{max-height:70vh;overflow:auto;}
    .sticky-head-wrap thead th{position:sticky;top:0;z-index:3;}
  }

  /* Tablas: resaltado de fila al pasar el cursor */
  .app-table tbody tr:hover td{background:var(--surf-2);}

  @media (min-width:1100px){
    .brief-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;}
    .brief-two > .card{margin-bottom:0;}
    /* tablas de costo: no estirarlas a 1400px, los números quedan lejos de su etiqueta */
    .cap-900{max-width:900px;}
  }
  @media (min-width:1300px){
    .home-kpis{margin-bottom:8px;}
  }

  /* ============ Topbar: menú oculto hasta pasar el cursor (o tocar en móvil) ============ */
  .hover-reveal{position:relative;display:inline-block;margin-left:auto;}
  .hover-handle{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;
    border:1px solid var(--border-c);background:var(--surf-card);color:var(--text-2);cursor:pointer;font-size:18px;user-select:none;}
  .hover-handle:hover{border-color:var(--border-strong);color:var(--text-1);}
  .hover-items{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--surf-card);
    border:1px solid var(--border-strong);border-radius:8px;padding:10px;gap:8px;z-index:300;
    box-shadow:0 8px 24px rgba(0,0,0,.5);flex-wrap:wrap;max-width:360px;}
  .hover-reveal:hover .hover-items, .hover-reveal.open .hover-items{display:flex;}
  .btn-nav-grande{font-size:14px;padding:10px 18px;flex:1 0 100%;}

  /* ============ Proveedores ============ */
  .chip-prov{display:inline-block;background:var(--accent-tint);color:var(--accent-text);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;margin-left:4px;}
  .chips-edit{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .chip-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surf-3);border:1px solid var(--border-c);border-radius:14px;padding:4px 6px 4px 12px;font-size:12px;}
  .chip-tag button{background:none;border:none;color:var(--text-2);cursor:pointer;font-size:14px;padding:0 4px;}
  .chip-tag button:hover{color:var(--warn);}

  /* ============ Modal propio (reemplaza prompt()/confirm()) ============ */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:var(--surf-card);border:1px solid var(--border-strong);border-radius:8px;padding:20px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .modal-box h3{margin:0 0 12px;font-family:var(--font-title);font-size:15px;text-transform:uppercase;}
  .modal-box p{margin:0 0 16px;font-size:13px;color:var(--text-1);line-height:1.5;}
  .modal-box input{width:100%;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  .modal-lista{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-bottom:16px;}
  .modal-opcion{text-align:left;background:var(--surf-2);border:1px solid var(--border-c);border-radius:6px;padding:10px 12px;color:var(--text-1);cursor:pointer;font-family:var(--font-sub);font-size:13px;}
  .modal-opcion:hover{border-color:var(--accent-text);background:var(--surf-3);}

  /* ============ Ficha del responsable (empresa, puesto, teléfono) ============ */
  .resp-ficha{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding:8px 10px;background:var(--surf-2);border-radius:4px;font-size:11.5px;}
  .resp-ficha b{color:var(--text-2);font-weight:700;}

  /* ============ Mockup: hover sobre piezas + controles de zoom/pan ============ */
  #mockup-svg-wrap g:hover{ filter: brightness(1.6); cursor: help; }
  #mockup-svg-wrap{ position:relative; overflow:hidden; touch-action:none; cursor:grab; }
  #mockup-svg-wrap:active{ cursor:grabbing; }
  .mockup-zoom-ctrl{ position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:4px; z-index:10; }
  .mockup-zoom-ctrl button{ width:34px; height:34px; border-radius:6px; border:1px solid var(--border-strong); background:var(--surf-card); color:var(--text-1); font-size:18px; cursor:pointer; }
  .mockup-zoom-ctrl button:hover{ background:var(--surf-3); }
  #loginOverlay{ display:none; position:fixed; inset:0; background:#0b0d10; z-index:1000; align-items:center; justify-content:center; font-family:inherit; }
  #loginOverlay .login-box{ width:100%; max-width:340px; padding:28px; background:#15181c; border:1px solid #2a2f36; border-radius:10px; }
  #loginOverlay h1{ font-size:18px; margin:0 0 4px; color:#fff; }
  #loginOverlay p.sub{ font-size:13px; color:#9aa3ad; margin:0 0 20px; }
  #loginOverlay label{ display:block; font-size:12px; color:#9aa3ad; margin:12px 0 4px; }
  #loginOverlay input{ width:100%; box-sizing:border-box; padding:10px 12px; border-radius:6px; border:1px solid #2a2f36; background:#0b0d10; color:#fff; font-size:14px; }
  #loginOverlay button[type=submit]{ width:100%; margin-top:20px; padding:11px; border:none; border-radius:6px; background:#3b82f6; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  #loginOverlay button[type=submit]:disabled{ opacity:.6; cursor:default; }
  #loginError{ display:none; margin-top:14px; font-size:13px; color:#f87171; }
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="login-box">
    <h1>Marabunta</h1>
    <p class="sub">Inicia sesión para continuar</p>
    <form id="loginForm">
      <label for="loginEmail">Correo</label>
      <input id="loginEmail" name="email" type="email" required autocomplete="username" />
      <label for="loginPassword">Contraseña</label>
      <input id="loginPassword" name="password" type="password" required autocomplete="current-password" />
      <button type="submit">Entrar</button>
      <div id="loginError"></div>
    </form>
  </div>
</div>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="guardandoIndicator" style="display:none; position:fixed; bottom:16px; left:16px; z-index:999; background:#1f2937; color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.3);">Guardando…</div>

// ---------- storage abstraction (idéntica a la del Planeador de Requerimientos
// Operativos): usa window.storage si está disponible (contexto Claude), si no
// IndexedDB (cuota amplia, ideal para archivo descargado y abierto localmente),
// y localStorage / memoria como último recurso. ----------
const memoryFallback = new Map();
let localStorageWorks = true;
try{ localStorage.setItem('marabunta:__test__','1'); localStorage.removeItem('marabunta:__test__'); }catch(e){ localStorageWorks = false; }
const LocalStorageShim = {
  async get(key){
    if(localStorageWorks){
      try{ const v = localStorage.getItem('marabunta:'+key); if(v!==null) return {key, value:v, shared:false}; }catch(e){}
    }
    if(memoryFallback.has(key)) return {key, value:memoryFallback.get(key), shared:false};
    throw new Error('not found');
  },
  async set(key,value){
    if(localStorageWorks){
      try{
        localStorage.setItem('marabunta:'+key, value);
        memoryFallback.delete(key);
        return {key,value,shared:false};
      }catch(e){
        memoryFallback.set(key,value);
        throw new Error('No se pudo guardar en este navegador (sin espacio disponible).');
      }
    }
    memoryFallback.set(key,value);
    return {key,value,shared:false};
  },
  async delete(key){
    if(localStorageWorks){ try{ localStorage.removeItem('marabunta:'+key); }catch(e){} }
    memoryFallback.delete(key);
    return {key,deleted:true,shared:false};
  }
};

let idbInstance = null;
let idbAvailable = typeof indexedDB !== 'undefined';
const idbReady = idbAvailable ? new Promise((resolve) => {
  try{
    const req = indexedDB.open('marabunta_db', 1);
    req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv', {keyPath:'key'}); };
    req.onsuccess = () => { idbInstance = req.result; resolve(true); };
    req.onerror = () => { idbAvailable = false; resolve(false); };
    req.onblocked = () => { idbAvailable = false; resolve(false); };
  }catch(e){ idbAvailable = false; resolve(false); }
}) : Promise.resolve(false);

function idbReq(request){
  return new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); });
}

const IndexedDBShim = {
  async get(key){
    await idbReady;
    if(!idbAvailable) return LocalStorageShim.get(key);
    try{
      const rec = await idbReq(idbInstance.transaction('kv','readonly').objectStore('kv').get(key));
      if(rec) return {key, value:rec.value, shared:false};
    }catch(e){}
    throw new Error('not found');
  },
  async set(key,value){
    await idbReady;
    if(!idbAvailable) return LocalStorageShim.set(key,value);
    try{
      await idbReq(idbInstance.transaction('kv','readwrite').objectStore('kv').put({key,value}));
      return {key,value,shared:false};
    }catch(e){
      throw new Error('No se pudo guardar en este navegador (sin espacio disponible).');
    }
  },
  async delete(key){
    await idbReady;
    if(!idbAvailable) return LocalStorageShim.delete(key);
    try{ await idbReq(idbInstance.transaction('kv','readwrite').objectStore('kv').delete(key)); }catch(e){}
    return {key,deleted:true,shared:false};
  }
};

let Store = (typeof window.storage !== 'undefined' && window.storage !== null) ? window.storage : IndexedDBShim;

const APP_ID = 'marabunta';
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function fmtFecha(iso){ if(!iso) return '—'; const p=iso.split('-'); if(p.length<3) return iso; const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return `${+p[2]} ${meses[+p[1]-1]} ${p[0]}`; }
function fmtFechaCorta(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length<3?iso:`${p[2]}/${p[1]}`; }
function num(v){ const n=Number(v); return isFinite(n)?n:0; }
function fmtMoney(n,d){ d=d==null?0:d; n=num(n); return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmt0(n){ return fmtMoney(n,0); }
function fmt2(n){ return fmtMoney(n,2); }
function fmtPct(x){ return (x==null||!isFinite(x)) ? '—' : (x*100).toFixed(1)+'%'; }

// Ingeniería de módulos: tarimas de Steel se arman con bays completos y, cuando hace falta ajustar el
// ancho, un medio bay (mitad exacta). El tamaño del bay es un catálogo editable (Configuración) — hoy es
// el estándar Layher (2.07 / 1.035), pero si el sistema cambia, se ajusta ahí sin tocar nada más.
function bayFull(){ return (C().bays||{}).full || 2.07; }
function bayMedio(){ return (C().bays||{}).medio || 1.035; }
function snapBay(valor){
  valor = Number(valor)||0; if(valor<=0) return {bays:0, medio:false, total:0};
  const BAY=bayFull(), MEDIO=bayMedio();
  const n = Math.floor(valor/BAY);
  const candidatos = [
    {bays:n, medio:false, total: n*BAY},
    {bays:n, medio:true,  total: n*BAY+MEDIO},
    {bays:n+1, medio:false, total:(n+1)*BAY}
  ];
  candidatos.sort((a,b)=>Math.abs(a.total-valor)-Math.abs(b.total-valor));
  return candidatos[0];
}
function fmtBay(sb){ return `${sb.bays} bay${sb.bays===1?'':'s'} de ${bayFull()}${sb.medio?' + 1 de '+bayMedio():''} = ${sb.total.toFixed(3)} m`; }
// Altura siempre en metros cerrados o medios metros
function snapAltura(valor){ return Math.round((Number(valor)||0)*2)/2; }

// Cable protectors (MCCS): sistema modular macho-hembra; el "grosor" se logra poniendo canaletas en
// paralelo. Canaleta: 0.91 m de largo, 0.31 m de ancho, 7.3 kg. Rampa de acceso (cierra cada extremo): 15 kg.
const MCCS = {largoCanaleta:0.91, anchoCanaleta:0.31, pesoCanaleta:7.3, pesoRampa:15};
function calcCable(item){
  const metros=Number(item.metrosLineales)||0, lineas=Math.max(1,Number(item.lineasParalelas)||1);
  const piezasPorLinea = metros>0 ? Math.ceil(metros/MCCS.largoCanaleta) : 0;
  const totalCanaletas = piezasPorLinea*lineas;
  const anchoReal = lineas*MCCS.anchoCanaleta;
  const rampas = item.incluirRampas!==false ? lineas*2 : 0;
  return {piezasPorLinea, totalCanaletas, anchoReal, rampas, pesoCanaletas: totalCanaletas*MCCS.pesoCanaleta, pesoRampas: rampas*MCCS.pesoRampa};
}

// Agrega al catálogo ya guardado cualquier área nueva que no exista (por id o por nombre normalizado),
// sin tocar las que el usuario ya tenga — así nadie pierde áreas o rubros que ya haya personalizado.
function migrarCatalogoAreas(){
  if(!Array.isArray(C().areas)) C().areas=[];
  const existentesNombres = new Set(C().areas.map(a=>norm(a.nombre)));
  const existentesIds = new Set(C().areas.map(a=>a.id));
  catalogoAreasDefault().forEach(def=>{
    if(existentesIds.has(def.id)){
      const actual = C().areas.find(a=>a.id===def.id);
      if(!Array.isArray(actual.rubros)) actual.rubros=def.rubros.slice();
      return;
    }
    if(existentesNombres.has(norm(def.nombre))) return;
    C().areas.push(Object.assign({}, def, {rubros:def.rubros.slice()}));
  });
  C().areas.forEach(a=>{ if(!Array.isArray(a.rubros)) a.rubros=[]; });
  // Pantallas necesita ancho/alto por rubro (no todas las áreas lo necesitan, por eso es un flag aparte).
  const pantallas = C().areas.find(a=>norm(a.nombre)===norm('Pantallas'));
  if(pantallas && !pantallas.medidas) pantallas.medidas='xy';
  // "General" se retiró del catálogo (Operaciones ya hace de catch-all) — si nadie la usa, se quita
  // sola; si alguien todavía la tiene asignada, se deja intacta para no perder ese dato sin avisar.
  const gral = C().areas.find(a=>a.id==='general');
  if(gral && !state.roster.some(p=>p.area==='general')) C().areas=C().areas.filter(a=>a.id!=='general');
  // Estructuras Temporales no tenía rubros antes de esta vuelta — si sigue vacío (nadie lo tocó a mano
  // todavía), se le ponen los recomendados; si ya tiene algo capturado, no se le mueve nada.
  const steel = C().areas.find(a=>a.id==='steel');
  if(steel && Array.isArray(steel.rubros) && !steel.rubros.length){
    steel.rubros = ['Stage','Roof System','Wings','Loading Docks','Estructuras Adicionales — Plataformas Cámaras/FOH','Estructuras Adicionales — Otros'];
  }
  // Migración de una sola vez: Ground Support y Backstage/Soporte salieron de la lista inicial (área de
  // trabajo estándar implícita, y Backstage ya vive en Materiales para Site) y el módulo se dividió en
  // Stage/Wings/Loading Docks por separado. Corre una vez; si luego el usuario borra algo de aquí, se respeta.
  if(steel && !C()._migV2Steel){
    steel.rubros = (steel.rubros||[]).filter(r=>r!=='Ground Support' && r!=='Backstage/Soporte' && r!=='Escenario' && r!=='Torres');
    ['Stage','Roof System','Wings','Loading Docks','Estructuras Adicionales — Plataformas Cámaras/FOH','Estructuras Adicionales — Otros'].forEach(def=>{
      if(!steel.rubros.some(r=>norm(r)===norm(def))) steel.rubros.push(def);
    });
    C()._migV2Steel = true;
  }
}

// Duplicados potenciales: mismo nombre normalizado, CURP distinto (o uno de los dos sin CURP)
function duplicadosPotenciales(){
  const grupos=new Map();
  state.roster.forEach(p=>{ const n=norm(p.nombre); if(!n) return; if(!grupos.has(n)) grupos.set(n,[]); grupos.get(n).push(p); });
  const out=[];
  grupos.forEach(arr=>{ if(arr.length<2) return; const curps=new Set(arr.map(p=>normCURP(p.curp)).filter(Boolean)); if(curps.size>1 || arr.some(p=>!p.curp)) out.push(arr); });
  return out;
}

/* ---------------- CSV (mismo parser robusto que el resto del ecosistema) ---------------- */
function parseCSV(text){
  text = String(text).replace(/^\uFEFF/,'');
  const first = text.split(/\r?\n/,1)[0] || '';
  const delim = [',',';','\t'].map(d=>[d, first.split(d).length-1]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=c; }
    else if(c==='"') inQ=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return {rows: rows.filter(r=>r.some(x=>String(x).trim()!==''))};
}

function dc3DesdeTexto(txt){ const t=norm(txt); if(t==='si'||t==='s') return 'SI'; if(t==='no'||t==='n') return 'NO'; if(t==='tbd') return 'TBD'; return ''; }
function detectarMapa(headers){
  // norm() no quita puntuación, así que "fecha nac." no calza exacto con "fecha nacimiento": se limpia aparte para este paso
  const clean=h=>norm(h).replace(/[.,]/g,'').trim();
  const full=headers.map(clean); const usado=new Set(); const map={};
  CAMPOS_ROSTER.forEach(c=>{ map[c.k]=-1; });
  [0,1].forEach(pasada=>{
    CAMPOS_ROSTER.forEach(c=>{
      if(map[c.k]>=0) return;
      for(const sy of c.syn.map(clean)){
        let hit=-1;
        for(let i=0;i<headers.length;i++){
          if(usado.has(i)) continue;
          const ok = pasada===0 ? full[i]===sy : (sy.length>=4 && full[i].length>=3 && (full[i].startsWith(sy) || sy.startsWith(full[i])));
          if(ok){ hit=i; break; }
        }
        if(hit>=0){ map[c.k]=hit; usado.add(hit); break; }
      }
    });
  });
  return map;
}
const AREA_ALIASES = {'administracion':'ops', 'admin':'ops'};
function areaDesdeTexto(txt){
  const n=norm(txt); if(!n) return '';
  if(AREA_ALIASES[n]) return AREA_ALIASES[n];
  const a=C().areas.find(x=>norm(x.nombre)===n) || C().areas.find(x=>n.includes(norm(x.nombre))||norm(x.nombre).includes(n));
  return a ? a.id : '';
}
// Las fechas de Excel llegan como objeto Date (con cellDates:true); UTC para no correrse un día por zona horaria
function fechaDeCelda(v){
  if(v instanceof Date && !isNaN(v)) return `${v.getUTCFullYear()}-${String(v.getUTCMonth()+1).padStart(2,'0')}-${String(v.getUTCDate()).padStart(2,'0')}`;
  return parseFechaCSV(v);
}
function parseFechaCSV(s){
  s=String(s||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m){ let d=+m[1],mo=+m[2]; if(mo>12&&d<=12){const t=d;d=mo;mo=t;} return `${m[3]}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  return '';
}
function tipoSangreDesdeTexto(txt){ const t=String(txt||'').toUpperCase().replace(/\s+/g,''); return TIPOS_SANGRE.includes(t) ? t : ''; }

function iniciarSync(){ state.imp={fileName:'', rows:[], headers:[], map:{}, filas:[], hojas:[], hojaSel:'', error:''}; state.view='sincronizar'; render(); window.scrollTo(0,0); }
function cargarFilas(headers, rows, name){
  const imp=state.imp;

  imp.fileName=name||'archivo'; imp.headers=headers.map(h=>String(h==null?'':h).trim()); imp.rows=rows; imp.error='';

}

function cargarWorkbookSync(buffer,name){
  const imp=state.imp;
  let wb; try{ wb = XLSX.read(buffer, {type:'array', cellDates:true}); }catch(e){ imp.error='No se pudo leer el archivo de Excel.'; render(); return; }
  imp.hojas = wb.SheetNames; imp.wb = wb;
  const porNombre = wb.SheetNames.find(n=>/personal/i.test(n));

function cargarHojaSync(nombreHoja, fileName){
  const imp=state.imp; imp.hojaSel=nombreHoja;
  const ws = imp.wb.Sheets[nombreHoja];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});

  if(!filas.length){ imp.error='Esa hoja no tiene filas de datos.'; render(); return; }
  cargarFilas(filas[0], filas.slice(1), fileName || imp.fileName);

function recalcSync(){
  const imp=state.imp; const M=imp.map; const get=(r,k)=> M[k]>=0 ? (r[M[k]]==null?'':r[M[k]]) : '';
  imp.filas = imp.rows.map(r=>{
    const curpRaw=String(get(r,'curp')||'').trim(), nombre=String(get(r,'nombre')||'').trim(), idExterno=String(get(r,'idExterno')||'').trim();
    const curp=normCURP(curpRaw);
    const d={curp, idExterno, nombre, fechaNacimiento:fechaDeCelda(get(r,'fechaNacimiento')), tipoSangre:tipoSangreDesdeTexto(get(r,'tipoSangre')), area:areaDesdeTexto(get(r,'area')), puesto:String(get(r,'puesto')||'').trim(), telefono:String(get(r,'telefono')||'').trim(), notas:String(get(r,'notas')||'').trim(), banco:String(get(r,'banco')||'').trim(), cuenta:String(get(r,'cuenta')||'').trim(), clabe:String(get(r,'clabe')||'').trim(), dc3:dc3DesdeTexto(get(r,'dc3'))};
    if(!nombre && !curp && !idExterno) return null;
    const existente = buscarExistente(curp) || (!curp && buscarPorNombreSinCurp(nombre));
    return {d, existente, sinCurp: !curp, incluir:true, motivoExcluido:''};
  }).filter(Boolean);
  // Dos filas del archivo con el mismo CURP: es la misma persona capturada dos veces. Nos quedamos con la más completa.
  const porCurp=new Map();
  imp.filas.forEach(f=>{ if(!f.d.curp) return; if(!porCurp.has(f.d.curp)) porCurp.set(f.d.curp,[]); porCurp.get(f.d.curp).push(f); });
  porCurp.forEach(grupo=>{
    if(grupo.length<2) return;
    grupo.sort((a,b)=>completitud(b.d)-completitud(a.d));
    grupo.slice(1).forEach(f=>{ f.incluir=false; f.motivoExcluido=`CURP repetido en el archivo — se conserva la fila de "${grupo[0].d.nombre}" por tener más datos`; });
  });
}

function aplicarSync(){

  imp.filas.forEach(f=>{
    if(!f.incluir) return;
    if(f.sinCurp) sinCurpN++;
    const camposSinc=['nombre','fechaNacimiento','tipoSangre','area','puesto','telefono','notas','banco','cuenta','clabe','dc3','dc3Numero'];
    if(f.existente){
      const p=f.existente; camposSinc.forEach(k=>{ if(f.d[k]) p[k]=f.d[k]; });
      if(f.d.idExterno) p.idExterno=f.d.idExterno;
      act++;
    } else {
      state.roster.push(nuevaPersona(Object.assign({curp:f.d.curp, idExterno:f.d.idExterno}, Object.fromEntries(camposSinc.map(k=>[k,f.d[k]])))));
      nuevos++;
    }
  });
  persistPersonas();
  return {nuevos, act, sinCurpN};
}

function parseListaCrew(texto){
  const filas=String(texto||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>l.split('\t').map(c=>c.trim()));
  if(!filas.length) return [];
  const cab=filas[0].map(norm);
  let mapa=null;
  if(cab.some(c=>['nombre','curp','area','área'].includes(c))){ mapa=cab; filas.shift(); }
  else mapa=['nombre','curp','area'];
  const iN=mapa.indexOf('nombre')>=0?mapa.indexOf('nombre'):(mapa.indexOf('nombre completo')>=0?mapa.indexOf('nombre completo'):0);
  const iC=mapa.indexOf('curp'); const iA=mapa.findIndex(x=>x==='area'||x==='área');
  return filas.map(c=>{
    const nombre=(c[iN]||'').trim(), curp=(c[iC]||'').trim(), areaTxt=iA>=0?(c[iA]||'').trim():'';
    if(!nombre) return null;
    let match=null;
    if(curp) match=buscarPorCURP(curp);
    if(!match){ const cands=candidatosPorNombre(nombre); if(cands.length===1) match=cands[0]; }
    return {nombre, curp, area:areaDesdeTexto(areaTxt), match, candidatos: match?[]:candidatosPorNombre(nombre)};
  }).filter(Boolean);
}

function ensureProyecto(p){
  ['eventoId','artista','cliente','clienteContacto','venue','ciudad','nota'].forEach(k=>{ if(p[k]==null) p[k]=''; });
  if(!p.id) p.id=uuid();
  if(!p.estado) p.estado='prospecto';
  if(p.giraId===undefined) p.giraId=null;
  if(p.venueId===undefined) p.venueId=null;
  if(!p.reqPromotor) p.reqPromotor={activos:{}, notas:{}};
  // Migración: las áreas eran 3 casillas fijas (steel/eps/ops); ahora son una lista editable y ampliable.
  // El id de las 3 originales se conserva igual para que todo lo que ya dependía de 'steel'/'eps'/'ops'
  // (bays, hospedaje, combustible) siga funcionando aunque el usuario les cambie el nombre.
  if(!Array.isArray(p.areas)){
    const old=p.areas||{}; const nuevas=[];
    if(old.steel) nuevas.push({id:'steel',nombre:'Steel',tipo:'steel'});
    if(old.eps) nuevas.push({id:'eps',nombre:'EPS',tipo:'eps'});
    if(old.ops) nuevas.push({id:'ops',nombre:'Operaciones',tipo:'generico'});
    p.areas=nuevas;
  }
  if(!p.fechas) p.fechas={llegada:'',showday:'',loadOut:'',tiposPorDia:{}};
  if(!p.fechas.tiposPorDia) p.fechas.tiposPorDia={};
  if(!p.fechas.turnosPorDia) p.fechas.turnosPorDia={};
  if(!p.fechas.viajesPorDia) p.fechas.viajesPorDia={};
  if(!p.fechas.hotel) p.fechas.hotel={nombre:'',direccion:'',checkin:'',checkout:'',notas:''};
  if(!p.fechasPorArea || Array.isArray(p.fechasPorArea)) p.fechasPorArea={};
  Object.keys(p.fechasPorArea).forEach(k=>{ if(p.fechasPorArea[k] && !p.fechasPorArea[k].tiposPorDia) p.fechasPorArea[k].tiposPorDia={}; if(p.fechasPorArea[k] && !p.fechasPorArea[k].turnosPorDia) p.fechasPorArea[k].turnosPorDia={}; if(p.fechasPorArea[k] && !p.fechasPorArea[k].viajesPorDia) p.fechasPorArea[k].viajesPorDia={}; if(p.fechasPorArea[k] && !p.fechasPorArea[k].hotel) p.fechasPorArea[k].hotel={nombre:'',direccion:'',checkin:'',checkout:'',notas:''}; });
  // Migración: un responsable por rol fijo (pm/jefeSteel/supervisorEps) -> un responsable por área (dinámico)
  if(!p.responsablesPorArea){
    p.responsablesPorArea={};
    const r=p.responsables||{}, c=p.conflictos||{};
    if(r.jefeSteel) p.responsablesPorArea.steel={personaId:r.jefeSteel, puesto:'Jefe de Steel', conflicto:c.jefeSteel||null};
    if(r.supervisorEps) p.responsablesPorArea.eps={personaId:r.supervisorEps, puesto:'Supervisor EPS', conflicto:c.supervisorEps||null};
    if(r.pm) p.responsablesPorArea.ops={personaId:r.pm, puesto:'Project Manager', conflicto:c.pm||null};
  }
  if(!Array.isArray(p.reqSteel)) p.reqSteel=[];
  if(!Array.isArray(p.reqDelay)) p.reqDelay=[];
  if(!Array.isArray(p.reqPanel)) p.reqPanel=[];
  if(!p.reqBarricada) p.reqBarricada={};
  if(!Array.isArray(p.reqCable)) p.reqCable=[];
  // Requerimientos genéricos por área (para cualquier área que no sea de tipo steel/eps); lo que ya
  // existiera en la tabla libre de "Otros" se conserva aparte, para no perder nada de lo ya capturado.
  if(!p.reqGenerico) p.reqGenerico={};
  if(Array.isArray(p.requerimientos) && p.requerimientos.length && !p.reqGenerico._legacy){ p.reqGenerico._legacy=p.requerimientos; }
  if(!Array.isArray(p.reqGenerico._legacy)) p.reqGenerico._legacy=p.reqGenerico._legacy||[];
  // Sub-grupos por área (ej. Audio -> PA, Monitoreo, RF). Si un área no tiene sub-grupos, se queda
  // con la tabla libre de reqGenerico de siempre — esto es un modo aparte, no reemplaza al anterior.
  if(!p.reqGenericoGrupos) p.reqGenericoGrupos={};
  if(!p.updatedAt) p.updatedAt=Date.now();
  return p;
}

const PLANNER_VERSION = 7; // sube este número cuando cambie la forma de las secciones (fuerza regenerarlas)
function fechasProyectoPlanner(p){ const r=rangoDeProyecto(p); return r ? diasDeRango(r.ini,r.fin) : []; }
function nuevaFilaPlanner(label, tipo, fechas, extra){ const cells={}; fechas.forEach(f=>{ cells[f]= tipo==='meals' ? {desayuno:{text:''},comida:{text:''},cena:{text:''}} : (tipo==='cargo' ? {status:'',text:''} : {text:''}); }); return Object.assign({id:uuid(), label, tipo, cells, cellsNoche:{}}, extra||{}); }
function seccionesPlannerDefault(p, fechas){
  const gruposDefault = () => Object.fromEntries(p.areas.map(a=>[a.id,[]]));
  const manoObraDefault = () => Object.fromEntries(p.areas.map(a=>[a.id,[nuevaFilaManoObra(fechas, a.tipo==='eps'?'Climbers':'Ayudantes Generales')]]));
  return [
    {id:uuid(), nombre:'Ruta Crítica', turno:true, rows: p.areas.map(a=>nuevaFilaPlanner(a.nombre,'texto',fechas,{areaId:a.id}))},
    {id:uuid(), nombre:'Catering', modo:'catering', turno:true, rows:[{id:uuid(),meal:'desayuno',label:'Desayuno'},{id:uuid(),meal:'comida',label:'Comida'},{id:uuid(),meal:'cena',label:'Cena'}].map(r=>Object.assign(r,{cells:{},cellsNoche:{}}))},
    {id:uuid(), nombre:'Mano de Obra Local', modo:'manoobra', turno:true, grupos: manoObraDefault()},
    {id:uuid(), nombre:'Access & Lifting', modo:'maquinaria', grupos: gruposDefault()},
    {id:uuid(), nombre:'Extras', rows: ['Bidón IBC 1000L','Agua para Contrapesos','Servicio Desazolve','Corriente Eléctrica (KVA)','Otros'].map(l=>nuevaFilaPlanner(l,'texto',fechas))},
    {id:uuid(), nombre:'CARGO', modo:'cargo', turno:true, grupos: gruposDefault()}
  ];
}
function nuevaFilaCargo(fechas){ return {id:uuid(), unidad:CARGO_UNIT_TYPES[0], cells: Object.fromEntries(fechas.map(f=>[f,{status:'',text:''}])), cellsNoche:{}}; }
function nuevaFilaManoObra(fechas,rol){ return {id:uuid(), rol:rol||'Ayudantes Generales', cells: Object.fromEntries(fechas.map(f=>[f,{text:''}])), cellsNoche:{}}; }
// Cuántas personas de esa área tienen turno ese día en el Proyector — para sugerir solas las 3 comidas de Catering.
function cateringAutoHeadcount(p, areaK, fecha){
  sincronizarProyector(p);
  return p.proyector.crew.filter(c=>c.area===areaK && turnoEfectivoProyector(p,c,fecha)).length;
}
// Suma general (todas las áreas del proyecto) de personas con turno ese día — una sola cifra por comida.
function cateringAutoTotal(p, fecha){
